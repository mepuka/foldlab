name = "unity"
defaultTargets = ["Unity", "control", "emit", "ts"]

[[require]]
name = "fabric"
path = "../fabric"

[[require]]
name = "kernel"
path = "../kernel"

# The projection AST, consumed one way only: the toolkit knows nothing about
# this package, and its own gate refuses a second path dependency.
[[require]]
name = "projections"
path = "../projections"

[[lean_lib]]
name = "Unity"
globs = [
  "Unity",
  "Unity.Canon",
  "Unity.Program",
  "Unity.Shape",
  "Unity.Reflect",
  "Unity.Emit",
  "Unity.Check",
  "Unity.Dsl",
  "Unity.Sha",
  "Unity.Ts",
  "Unity.TsKernel",
]

[[lean_exe]]
name = "control"
root = "ControlMain"

[[lean_exe]]
name = "emit"
root = "EmitMain"

[[lean_exe]]
name = "ts"
root = "TsMain"
supportInterpreter = true
