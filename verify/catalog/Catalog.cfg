\* Gate configuration: the ratified model at 2 daemons, 3 values, 2
\* concurrent creators, data journals capped at 2 frames each.  Catalogs
\* and mirrors need no artificial cap — Convergence bounds them by the
\* value space (CatalogNaturallyBounded certifies this).  Explored to
\* closure.  A bounded check certifies only its bounds (ADR-0007 spirit):
\* what is claimed is exhaustiveness within THESE caps, nothing beyond.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 2
  NumVals = 3
  DataCap = 2
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
