\* Negative control 2: ForgedMirror — the ADR-0009 verified-mirror law
\* dropped, a replica appends a fabricated fact.  TLC MUST report a
\* violation of LagIsAbsenceNeverWrongData: lag becomes wrong data, the
\* exact failure mode the prefix property exists to exclude.  (Downstream,
\* a forged mirror also poisons union resolution — ResolvableOnlyViaCommitted
\* — but the prefix violation is the root cause and the required witness.)
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 2
  NumVals = 3
  DataCap = 2
  BlindIngress = FALSE
  ForgedMirror = TRUE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS TypeOK LagIsAbsenceNeverWrongData
