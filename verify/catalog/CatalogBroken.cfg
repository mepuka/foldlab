\* Negative control 1: BlindIngress — W4 dropped, ingress admits without
\* the resolve-check.  TLC MUST report a violation of NoAdmissionOnFaith
\* (a frame claiming an uncommitted digest enters a data journal in one
\* step).  AdmissionSeesResolution falls on the same transition; TLC
\* names the state invariant because state invariants are evaluated
\* before action properties.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 2
  NumVals = 3
  DataCap = 2
  BlindIngress = TRUE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS TypeOK NoAdmissionOnFaith
PROPERTIES AdmissionSeesResolution
