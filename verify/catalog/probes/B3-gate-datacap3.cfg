\* BREAKER BOUND PROBE B3. Baseline = Catalog.cfg, the GATE (2/2/3/2).
\* One dimension beyond: DataCap 2 -> 3 (deeper data journals). This is
\* the dimension the R3 induction claims to cover unboundedly, so a
\* violation here would contradict the Apalache result directly.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 2
  NumVals = 3
  DataCap = 3
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
