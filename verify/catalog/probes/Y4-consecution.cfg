\* BREAKER PROBE Y4 — an INDEPENDENT TLC replication of R3's consecution
\* (Apalache obligation 2) and action safety (obligation 4), by explicit
\* enumeration over arbitrary TYPED states satisfying IndInv rather than
\* over Apalache's symbolic Gen.
\*
\* Bounds are part of the claim: 2 daemons, 2 values, 1 creator, catalogs
\* up to length 2 (the natural maximum at NumVals = 2), mirrors up to
\* length 1, data journals up to length 1. Facts range over the FULL Fact
\* record set, so id is not forced to equal Digest(val).
\*
\* Because probeStep changes on every step, the two action properties are
\* checked WITHOUT the stuttering exemption of FINDING-BRIDGE-001.
\*
\* A violation of IndInv here is a counterexample-to-induction and a MAJOR
\* finding against R3. Agreement with Apalache is corroboration by an
\* independent tool, at smaller bounds, and is never proof.
SPECIFICATION CTISpec
