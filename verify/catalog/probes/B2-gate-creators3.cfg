\* BREAKER BOUND PROBE B2. Baseline = Catalog.cfg, the GATE (2/2/3/2).
\* One dimension beyond: NumCreators 2 -> 3 — a third concurrent CAS
\* racer at full gate width. Expected not to close in budget; a killed
\* run is reported as "no violation in the BFS prefix explored to depth
\* D in W seconds", which is a weaker claim than closure and is recorded
\* as such.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 3
  NumVals = 3
  DataCap = 2
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
