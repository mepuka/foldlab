\* BREAKER BOUND PROBE C1. Baseline = Catalog.cap2.cfg (2/2/2/1, a
\* certified-clean closure). One dimension beyond: NumDaemons 2 -> 3.
\* Purpose: reach closure one step outside a certified point rather than
\* only producing a truncated run outside the expensive gate point.
\* A clean verdict here is "clean at THESE bounds to closure", never proof.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 3
  NumCreators = 2
  NumVals = 2
  DataCap = 1
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
