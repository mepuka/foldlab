\* BREAKER BOUND PROBE C2. Baseline = Catalog.cap2.cfg (2/2/2/1).
\* One dimension beyond: NumCreators 2 -> 3. This is the dimension that
\* schedules a THIRD concurrent CAS racer against one authority journal —
\* the most direct attack on Convergence clause 1 and on the R3
\* CAS-freshness clause.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 3
  NumVals = 2
  DataCap = 1
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
