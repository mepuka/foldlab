\* BREAKER PROBE T1 (paired with T2). Probes: does the spec's domain
\* construction `Vals == { v \in 1..4 : v <= NumVals }` silently truncate
\* at 4, so that a config raising a bound past 4 runs at 4 while
\* CatalogNaturallyBounded (stated against the CONSTANT NumVals, not
\* against Cardinality(Vals)) silently loosens?
\* Single daemon, single creator: no mirrors, tiny closure, so the two
\* runs are decisive on state count alone.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 1
  NumCreators = 1
  NumVals = 4
  DataCap = 1
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
