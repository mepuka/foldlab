\* BREAKER PROBE T3. Same truncation question for the DAEMON domain, at
\* the gate's other bounds. If NumDaemons = 9 closes with exactly the
\* counts of a 4-daemon run (and, more cheaply, does not blow up), the
\* daemon domain is truncated too. Compared against T4 (NumDaemons = 4).
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 9
  NumCreators = 1
  NumVals = 1
  DataCap = 1
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
