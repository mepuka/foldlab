\* BREAKER PROBE Y5 — Y4 strengthened on the dimension that matters most
\* for the CAS-freshness clause: TWO creators (the R3 domain's count).
\*
\* Why this is the right dimension to spend on. Consecution is one step,
\* and a step involves one creator; but IndInv's freshness clause is a \A
\* over creators, so the post-state must satisfy it for EVERY creator.
\* The interaction only two creators can expose is a step by creator 1
\* that breaks creator 2's remembered absence-check. That is exactly the
\* shape of the counterexample that refuted PROVER's candidate A
\* (CLIMB.md), so it is the shape most likely to hide a CTI.
\*
\* Raw typed space: 441 catalogs x 25 mirrors x 9 data x 169 creators
\* = 16,769,025 states before the IndInv filter.
