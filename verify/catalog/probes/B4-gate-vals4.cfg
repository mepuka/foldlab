\* BREAKER BOUND PROBE B4. Baseline = Catalog.cfg, the GATE (2/2/3/2).
\* One dimension beyond: NumVals 3 -> 4. NOTE (see F-01): 4 is the
\* LARGEST value this spec's domain construction can express; 5 would
\* silently run as 4. So this probe exhausts the value dimension.
SPECIFICATION Spec
CONSTANTS
  NumDaemons = 2
  NumCreators = 2
  NumVals = 4
  DataCap = 2
  BlindIngress = FALSE
  ForgedMirror = FALSE
  AssertedIdentity = FALSE
  ResettingMirror = FALSE
INVARIANTS
  TypeOK Convergence NoAdmissionOnFaith ResolvableOnlyViaCommitted
  LagIsAbsenceNeverWrongData CatalogNaturallyBounded
PROPERTIES AdmissionSeesResolution ResolutionMonotonicity
