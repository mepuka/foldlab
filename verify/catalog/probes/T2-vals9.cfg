\* BREAKER PROBE T2 (paired with T1). Identical to T1 except NumVals = 9.
\* If T2's closure is IDENTICAL to T1's (same generated/distinct/depth),
\* the value domain did not grow: `1..4` truncates the domain silently,
\* and CatalogNaturallyBounded (Len(catalog[d]) <= NumVals) has quietly
\* become a claim about 9 that is discharged by a 4-value model.
