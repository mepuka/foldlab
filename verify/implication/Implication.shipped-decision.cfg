\* Independence control: the shipped rule with only the DECISION law checked.
\* MUST PASS — the defect corrupts the report, never the accept/refuse
\* decision. This is what proves the coherence and decision laws independent,
\* and bounds the blast radius of the walk.go defect to the teaching payload.
SPECIFICATION Spec
CONSTANTS
  MaxLen = 4
  Rule = "sorted"
INVARIANTS
  TypeOK
  WDecision
