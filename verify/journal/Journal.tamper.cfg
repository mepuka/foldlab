\* The ADVERSARY config: one appender, two journal positions, one storage
\* corruption available.  This is where the tamper-evidence laws are not
\* vacuous.  ChainIsSingleAndWellFormed is deliberately NOT listed: an
\* adversary that corrupts storage breaks it by definition, which is why JL1
\* is carried here by its step form (no APPENDER step forks the chain).
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 1
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
INVARIANTS
  TypeOK ReadIsTamperEvident JournalNaturallyBounded
PROPERTIES
  WritersNeverForkTheChain AppendIsExactlyOnceOrConflict
  OnlyVerifiedHeadsAreAdopted RecoveryIsPureStorage
