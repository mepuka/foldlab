\* The untrusted-store config: one mutation of the stored bytes per
\* behaviour over a three-entry journal, erasure excluded (it has its own
\* residual).  Three entries is the smallest journal in which a mutation
\* can be INTERIOR — neither the anchor nor the tail — which is exactly
\* the position the prev-link check is there to catch.
\*
\* What is checked here is what survives an untrusted store: the one
\* verifier, and the read fold relative to a trusted anchor.
\*
\* Three laws are deliberately NOT checked here, and the omission is the
\* claim's shape rather than an oversight.  Each is a law of the
\* trusted-store configs, and each fails here for a reason worth naming:
\*   StoreEqualsWritten  — false by construction once tamper is in force.
\*   ChainIntegrity      — an appender that adopts a forged tail chains its
\*     next entry to bytes the journal never wrote.  Nothing the reference
\*     checks can see that; RESIDUAL-001 is the trace.
\*   NoDuplicatePayload  — an absence read from mutated bytes is absence of
\*     evidence.  The absence snapshot is exactly as sound as the store it
\*     was taken from, and this is where that stops being true.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  TamperBudget = 1
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS
  TypeOK AnchoredReadIsGenuine
PROPERTIES AppendOnly AdoptionIsVerified
