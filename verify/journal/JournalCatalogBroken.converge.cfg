\* Refinement control 2.  BrokenCatalogBridge drops the daemon's
\* resolve-check, so the create path appends a value the catalog already
\* carries.  TLC MUST report a violation of CatalogConvergence: the catalog's
\* W1/W3 law — one fact per value per authority journal — fails over the
\* journal's image, which is the mechanical statement that convergence is the
\* daemon's law and not the journal's.
SPECIFICATION CreateSpec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 0
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
  BrokenCatalogBridge = TRUE
INVARIANTS TypeOK CatalogConvergence
