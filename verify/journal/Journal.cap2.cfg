\* Small-cap variant: two appenders racing the CAS, two payloads, a
\* two-entry journal, a trusted store and no process failure.  The cheap
\* pin — same laws, smaller closure; the cross-toolchain canary.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS
  TypeOK ChainIntegrity NoDuplicatePayload
  AnchoredReadIsGenuine StoreEqualsWritten
PROPERTIES AppendOnly AdoptionIsVerified
