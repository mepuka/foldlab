\* Negative control 5: StaleCasWins — the losing appender resyncs and
\* appends anyway, which is the naive retry and the whole reason the
\* reference reports a conflict instead of healing into one.  TLC MUST
\* report a violation of NoDuplicatePayload: two appenders that both found
\* a payload absent both land it, and the absence snapshot each of them
\* took has bought nothing.  This is the split-CAS branch the catalog gate
\* could not drive at its wire; the conflict it models is the only thing
\* standing between the two Begins and a duplicate.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = TRUE
  BlindBegin = FALSE
INVARIANTS TypeOK NoDuplicatePayload
