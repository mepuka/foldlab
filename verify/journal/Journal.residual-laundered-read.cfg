\* RESIDUAL-001, reader side.  TLC MUST report
\* CleanGenesisReadIsGenuineBelowTheTail violated.
\*
\* The same laundering seen from the other end: after an honest appender
\* has chained onto a forged tail, a fold from GENESIS over the whole
\* journal comes back clean and hands the caller a record the journal
\* never wrote, at a position that is no longer the tail.  A consumer that
\* keeps its anchor is covered by J4; a consumer that re-reads the world
\* from genesis is not.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  TamperBudget = 1
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS CleanGenesisReadIsGenuineBelowTheTail
