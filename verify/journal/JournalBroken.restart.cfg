\* Negative control 5: AmnesicRestart — JL5 dropped, a reopened handle keeps
\* its pre-crash in-memory head instead of re-deriving it from durable
\* storage.  TLC MUST report a violation of RecoveryIsPureStorage: after a
\* rival's append, the reopened handle's head is not the one the verifier
\* derives from the store.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  MaxTampers = 0
  MaxCrashes = 1
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = TRUE
INVARIANTS TypeOK
PROPERTIES RecoveryIsPureStorage
