\* Negative control 3: UnverifiedResync — the one-verifier law dropped.
\* Cursor adoption trusts the stored record's own declared position
\* instead of re-deriving it against the position it occupies, so the
\* writer inherits a weaker tamper-evidence law than the reader.  TLC MUST
\* report a violation of AdoptionIsVerified.  Tamper is in force because
\* that is the only circumstance in which the two paths disagree — a law
\* about a trusted store would be a law about nothing.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  TamperBudget = 1
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = TRUE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
PROPERTIES AdoptionIsVerified
