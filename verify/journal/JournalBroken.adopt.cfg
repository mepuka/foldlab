\* Negative control 4: UnverifiedAdopt — D60/JL4 dropped, the tail is adopted
\* on the broker's word without the stored-entry verifier.  With one storage
\* corruption available, TLC MUST report a violation of
\* OnlyVerifiedHeadsAreAdopted: a handle takes a head the verifier would have
\* refused, so the writer's tamper-evidence law is weaker than the reader's.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  MaxTampers = 1
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = TRUE
  AmnesicRestart = FALSE
INVARIANTS TypeOK
PROPERTIES OnlyVerifiedHeadsAreAdopted
