\* The CRASH config: two appenders, two journal positions, one crash event
\* available — a lost acknowledgement at the commit point, or a reopen
\* between any two steps.  This is where recovery and the idempotent
\* duplicate branch are exercised.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  MaxTampers = 0
  MaxCrashes = 1
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
INVARIANTS
  TypeOK ChainIsSingleAndWellFormed ReadIsTamperEvident JournalNaturallyBounded
PROPERTIES
  WritersNeverForkTheChain AppendIsExactlyOnceOrConflict
  OnlyVerifiedHeadsAreAdopted RecoveryIsPureStorage
