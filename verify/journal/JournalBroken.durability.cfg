\* Negative control 2: LossyCrash — the durability assumption dropped, an
\* appender's crash takes the tail it had already stored with it.  TLC
\* MUST report a violation of AppendOnly: the journal is no longer a log
\* that only grows.  This is the control that prices the reference's file
\* storage and acknowledged publish.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 1
  BlindAppend = FALSE
  LossyCrash = TRUE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
PROPERTIES AppendOnly
