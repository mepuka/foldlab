  NumWriters = 5
  NumPayloads = 2
  Cap = 2
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS TypeOK
