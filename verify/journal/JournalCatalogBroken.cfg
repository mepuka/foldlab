\* The faithless refinement: BlindBegin — create without the
\* resolve-check.  TLC MUST report CatalogRefinement violated.  The step
\* the journal takes is not a catalog step: the abstract create would have
\* converged on a value it can already resolve, and instead a second
\* creator goes busy.  A bridge that cannot fail bridges nothing.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 3
  NumPayloads = 3
  Cap = 3
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = TRUE
PROPERTIES CatalogRefinement
