\* Refinement control 1 — THE SPLIT-CAS OBLIGATION.  NoCAS drops the
\* expected-position guard, so an appender that snapshotted a stale position
\* lands anyway.  TLC MUST report a violation of CatalogRefinement: the
\* catalog model conflicts on exactly that step, so the journal step is not
\* the catalog step it claims to be.  This is the mechanical statement that
\* the catalog's stale-CAS conflict branch IS this journal's CAS.
SPECIFICATION CreateSpec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 0
  MaxCrashes = 0
  NoCAS = TRUE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
  BrokenCatalogBridge = FALSE
PROPERTIES CatalogRefinement
