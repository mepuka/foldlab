\* The refinement at the R2 gate bounds: two creators racing the CAS over one
\* authority journal of three positions, two values.  Journal.tla remains the
\* proof source; CatalogRefinement is the TLC-checked bridge into the catalog
\* model, and the catalog's own invariants are checked over the abstraction.
SPECIFICATION CreateSpec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 0
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
  BrokenCatalogBridge = FALSE
INVARIANTS
  TypeOK ChainIsSingleAndWellFormed
  CatalogInitAgrees ConvergingCreateAgrees
  CatalogTypeOK CatalogConvergence CatalogNaturallyBounded
  CatalogLagIsAbsenceNeverWrongData CatalogResolvableOnlyViaCommitted
  CatalogNoAdmissionOnFaith
PROPERTIES
  CatalogRefinement
  CatalogResolutionMonotonicity CatalogAdmissionSeesResolution
  WritersNeverForkTheChain AppendIsExactlyOnceOrConflict
  OnlyVerifiedHeadsAreAdopted
