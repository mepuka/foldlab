\* The refinement into the catalog model, at the bounds where the catalog
\* model's own creator race lives: three appenders, three payloads, a
\* three-entry journal.
\*
\* Crash and tamper are both OFF, and that is the claim's shape.  A
\* pending appender that dies maps to a creator going idle at a position
\* still free, and the catalog model has no such step — process failure is
\* outside its action alphabet.  Tamper would leave a creator's expected
\* position derived from bytes the journal never wrote.  Neither is a
\* defect in the mapping; both are laws the catalog does not have, and the
\* journal proves them on its own in the configs above.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 3
  NumPayloads = 3
  Cap = 3
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS AbstractTypeOK AbstractConvergence
PROPERTIES CatalogRefinement
