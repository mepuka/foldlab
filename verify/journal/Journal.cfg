\* The gate config: two appenders racing the CAS over a three-entry
\* journal with three payloads, a trusted store, and one appender crash
\* per behaviour.  Crash is in force here and the recovery law is proved
\* HERE, because it does not transfer through the catalog refinement.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 3
  Cap = 3
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 1
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS
  TypeOK ChainIntegrity NoDuplicatePayload
  AnchoredReadIsGenuine StoreEqualsWritten
PROPERTIES AppendOnly AdoptionIsVerified
