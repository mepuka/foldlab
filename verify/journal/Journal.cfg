\* The RACE config: two appenders contending for the same expected position,
\* three journal positions, two payloads.  No adversary and no crash — this is
\* the configuration in which the chain and append laws are the whole story.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 0
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
INVARIANTS
  TypeOK ChainIsSingleAndWellFormed ReadIsTamperEvident JournalNaturallyBounded
PROPERTIES
  WritersNeverForkTheChain AppendIsExactlyOnceOrConflict
  OnlyVerifiedHeadsAreAdopted RecoveryIsPureStorage
