\* Bound guard: Cap outside the expressible literal domain.  The head
\* space is built from that ceiling, so a longer journal is not a bigger
\* run — it is a different model, and the guard says so.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 5
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS TypeOK
