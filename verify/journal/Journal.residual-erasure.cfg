\* RESIDUAL-002, checked rather than assumed.  TLC MUST report
\* NothingWrittenIsMissing violated once ERASURE is in the tamper alphabet.
\*
\* An administrative purge removes a durable entry, and there is no check
\* the journal can run against a record that is simply gone: the chain
\* that remains is a perfectly valid shorter chain, and a fold from
\* genesis comes back clean.  Durability is therefore conditional on a
\* substrate that does not erase, and the
\* reference implementation spends most of its stream-shape refusals
\* buying exactly that condition — deny delete, deny purge, no eviction
\* limit, no per-message expiry.  Those refusals are the assumption's
\* price; this trace is what the assumption is worth.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 1
  NumPayloads = 2
  Cap = 2
  TamperBudget = 1
  AllowErasure = TRUE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS NothingWrittenIsMissing
