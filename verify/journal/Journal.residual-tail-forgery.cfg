\* RESIDUAL-001, writer side, checked rather than assumed.  TLC MUST
\* report ChainIntegrity violated.
\*
\* A reader holding no prior head accepts a mutated TAIL record: it is
\* canonical and it still chains from its predecessor.  The reference
\* implementation has the same gap and says so where it adopts a tail.
\* What the trace adds is the half that note does not reach — an honest
\* appender then adopts that forged tail as its cursor and writes its next
\* entry ONTO the forgery.  From that step the journal's own writes are no
\* longer a chain, and no later read can separate them from the bytes the
\* journal wrote.  Tail forgery is not confined to the tail.
\*
\* This is why J4 carries the chain law as a hypothesis, and why the
\* ledger row bounds the read claim to a trusted anchor over a store that
\* has not already been chained onto.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  TamperBudget = 1
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS ChainIntegrity
