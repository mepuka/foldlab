\* Negative control 1: BlindAppend — the expected-position CAS dropped,
\* the append lands at the tail whatever position its writer snapshotted.
\* TLC MUST report a violation of ChainIntegrity: an entry that lands
\* anywhere but the position it declares carries a prev that no longer
\* names its predecessor.  The CAS is not merely a race guard — it is what
\* makes the hash-chain link correct.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = TRUE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS TypeOK ChainIntegrity
