\* Negative control 2: OptimisticOutcome — JL2 dropped, a lost append is
\* reported as stored and the appender keeps the head it never landed.  TLC
\* MUST report a violation of AppendIsExactlyOnceOrConflict: the losing
\* appender's own digest is not at its expected position, and it did not fall
\* back to verified storage either.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 0
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = TRUE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
INVARIANTS TypeOK
PROPERTIES AppendIsExactlyOnceOrConflict
