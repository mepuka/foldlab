\* Negative control 1: NoCAS — JL1 dropped, the append lands at the tail
\* without the expected-position guard.  TLC MUST report a violation of
\* WritersNeverForkTheChain: two appenders that snapshotted the same expected
\* position both land, and the second record claims a position it does not
\* occupy.  ChainIsSingleAndWellFormed falls on the same reachable state; the
\* config names only the step law so the refutation is unambiguous.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 3
  MaxTampers = 0
  MaxCrashes = 0
  NoCAS = TRUE
  OptimisticOutcome = FALSE
  TrustingRead = FALSE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
INVARIANTS TypeOK
PROPERTIES WritersNeverForkTheChain
