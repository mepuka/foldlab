\* Negative control 3: TrustingRead — JL3 dropped, the read fold keeps the
\* position check but drops the prev-link check.  With one storage corruption
\* available, TLC MUST report a violation of ReadIsTamperEvident: the fold
\* returns a clean verdict over a prefix that is not a well-formed chain.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 1
  NumPayloads = 2
  Cap = 2
  MaxTampers = 1
  MaxCrashes = 0
  NoCAS = FALSE
  OptimisticOutcome = FALSE
  TrustingRead = TRUE
  UnverifiedAdopt = FALSE
  AmnesicRestart = FALSE
INVARIANTS TypeOK ReadIsTamperEvident
