\* Negative control 4: ForgivingRead — the prev-link check dropped from
\* the read fold, leaving a reader that checks positions and calls it
\* verification.  TLC MUST report a violation of AnchoredReadIsGenuine: a
\* mutation at an INTERIOR position, neither the trusted anchor nor the
\* tail, is handed back to the caller as though the journal had written
\* it.  Three entries is the smallest journal with an interior position,
\* which is why this control is capped one higher than its siblings.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 3
  Cap = 3
  TamperBudget = 1
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = TRUE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS AnchoredReadIsGenuine
