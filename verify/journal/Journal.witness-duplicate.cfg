\* Anti-vacuity witness 2: the uncertain-retry duplicate branch is
\* REACHABLE.  An append lands, its acknowledgement is lost, and the
\* byte-identical retry finds its own bytes at the position — the
\* reference's confirmatory re-read.  TLC MUST report
\* NoUncertainRetryDuplicate violated.
SPECIFICATION Spec
CONSTANTS
  NumWriters = 2
  NumPayloads = 2
  Cap = 2
  TamperBudget = 0
  AllowErasure = FALSE
  CrashBudget = 0
  BlindAppend = FALSE
  LossyCrash = FALSE
  UnverifiedResync = FALSE
  ForgivingRead = FALSE
  StaleCasWins = FALSE
  BlindBegin = FALSE
INVARIANTS NoUncertainRetryDuplicate
