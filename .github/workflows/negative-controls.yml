# The negative-controls battery — the gate for the gates.
#
# `AGENTS.md`: "A prover that cannot fail proves nothing. Every gate ships its
# negative controls, each refuted on exactly the law it dropped." The controls
# exist and are good; this workflow is what keeps them COMPILED and RUN rather
# than human-invoked (#32) — an uncompiled control rots silently.
#
# Slimmed 2026-08-15 by the estate-focus purge: the wasm wall, the gauntlet
# verifier lanes, and their bundles live at tag `archive/pre-estate-focus`
# (manifest: docs/research/2026-08-15-estate-focus-retirement.md). What
# remains is the R4 catalog control battery, the laws index, and the package
# test policy — per push — plus the weekly D59 bridge + R4 lockstep tier.
#
# Every step that asserts something ships its own refutation, in the job:
#   - the reply-mutant harness is run with NO tag and must FAIL
#     ("reply-mutant mode requires one catalogr4_reply_* build tag");
#   - the sabotage control is run with NO tag and must FAIL
#     ("the AssertedIdentity sabotage went undetected");
#   - both index gates ship `--self-test` modes that plant one defect per rule.
# A green run of this workflow therefore certifies that the controls can still
# fail, which is the only thing that makes the other gates' green mean anything.
name: negative-controls

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays, 05:43 UTC — after model-gate's 05:17 so the two TLC jobs do not
    # contend for the same shared runners, and off the hour because GitHub's
    # scheduler queues deepest there.
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: negative-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    name: build-tagged controls and the laws index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -Eeuo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      # Same pins as gates.yml, for the same reason: bun 1.3.14 is what
      # @types/bun pins, and Go comes from go/go.mod so there is one place to
      # re-pin.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: root — bun install
        run: bun install --frozen-lockfile 2>&1 | tee ci-logs/nc-install.log

      # --- the five non-default build tags ---------------------------------
      # Compilation alone is the floor, not the gate: the point of building
      # every variant is that a refactor cannot break a control's BUILD without
      # this job going red. The behavioural runs follow.
      - name: proto/go — compile all five tagged variants
        working-directory: proto/go
        run: |
          for tag in \
            catalogr4_sabotage \
            catalogr4_reply_created \
            catalogr4_reply_converged \
            catalogr4_reply_admitted \
            catalogr4_reply_refused
          do
            echo "== compiling -tags $tag"
            go build -tags "$tag" ./...
          done

      # --- the controls can fail (run these FIRST) -------------------------
      # Cheap and decisive: if the harness cannot report an absent control,
      # nothing below means anything, so spend the two seconds before the
      # twenty minutes.
      - name: canary — the mutant harness refuses to run untagged
        working-directory: proto/go
        run: |
          if go run ./catalogr4/cmd -mode reply-mutant > ../../ci-logs/nc-canary-mutant.log 2>&1; then
            cat ../../ci-logs/nc-canary-mutant.log
            echo "CANARY FAILED: an untagged reply-mutant run came back green;"
            echo "RunReplyMutantControl is not wired to the build tags."
            exit 1
          fi
          grep -q "reply-mutant mode requires one catalogr4_reply_\* build tag" \
            ../../ci-logs/nc-canary-mutant.log
          echo "canary ok: untagged reply-mutant refuses, naming the missing tag"

      - name: canary — the sabotage control cannot pass untagged
        working-directory: proto/go
        run: |
          if go run ./catalogr4/cmd -mode sabotage > ../../ci-logs/nc-canary-sabotage.log 2>&1; then
            cat ../../ci-logs/nc-canary-sabotage.log
            echo "CANARY FAILED: the sabotage control passed WITHOUT the"
            echo "catalogr4_sabotage tag — it is detecting something other than"
            echo "the planted AssertedIdentity behaviour."
            exit 1
          fi
          grep -q "the AssertedIdentity sabotage went undetected" \
            ../../ci-logs/nc-canary-sabotage.log
          echo "canary ok: untagged sabotage is undetectable, as it must be"

      # --- the R4 controls, per tag ---------------------------------------
      - name: R4 — sabotage control (catalogr4_sabotage)
        working-directory: proto/go
        run: go run -tags catalogr4_sabotage ./catalogr4/cmd -mode sabotage 2>&1 | tee ../../ci-logs/nc-sabotage.log

      # One run per tag. Each tagged binary changes only the decoded reply
      # shape on one branch; the daemon state and the model expectation stay
      # honest, so the divergence the driver reports names the branch that was
      # mutated. Four branches, four tags, four separate refutations — a single
      # control that broke all four would prove nothing about which law each
      # covers (verify/AGENTS.md's independence rule).
      - name: R4 — reply-mutant gate, once per tag
        working-directory: proto/go
        run: |
          for tag in \
            catalogr4_reply_created \
            catalogr4_reply_converged \
            catalogr4_reply_admitted \
            catalogr4_reply_refused
          do
            echo "== reply mutant: $tag (must be caught)"
            go run -tags "$tag" ./catalogr4/cmd -mode reply-mutant
          done 2>&1 | tee ../../ci-logs/nc-reply-mutants.log

      - name: R4 — corrupted controls across the corpus
        working-directory: proto/go
        run: go run ./catalogr4/cmd -mode corrupted 2>&1 | tee ../../ci-logs/nc-corrupted.log

      # The coverage assertion is the anti-vacuity check on the corpus itself:
      # a corpus that stopped covering a ratified branch would let every
      # control above pass while checking less.
      - name: R4 — corpus determinism + ratified-branch coverage
        working-directory: proto/go
        run: |
          go test ./catalogr4 -run '^TestCorpusIsDeterministicAndCoversEveryRatifiedBranch$' -count=1 \
            2>&1 | tee ../../ci-logs/nc-coverage-test.log
          go run ./catalogr4/cmd -mode coverage 2>&1 | tee ../../ci-logs/nc-coverage.log

      - name: R4 — honest replay
        working-directory: proto/go
        run: go run ./catalogr4/cmd -mode honest 2>&1 | tee ../../ci-logs/nc-honest.log

      # --- the laws index --------------------------------------------------
      - name: laws index — the index gate can fail
        run: bun scripts/check-laws.ts --self-test 2>&1 | tee ci-logs/nc-laws-selftest.log

      - name: laws index — every law still points at its statement and its test
        run: bun scripts/check-laws.ts 2>&1 | tee ci-logs/nc-laws.log

      - name: package test policy — the empty-placeholder exemption can fail
        run: bun scripts/check-package-tests.ts --self-test 2>&1 | tee ci-logs/nc-package-tests-selftest.log

      - name: package test policy — every runtime package has a test
        run: bun scripts/check-package-tests.ts 2>&1 | tee ci-logs/nc-package-tests.log

      - name: Upload control output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: negative-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 30

  bridge:
    name: D59 wire bridge + R4 lockstep (TLC)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -Eeuo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      # run-wire.sh resolves Java as `mise x java@21 -- java` when mise is on
      # PATH and plain `java` otherwise. The runner has no mise, so this JDK is
      # what it finds — the same Temurin 21 line model-gate.yml uses.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # run-r4.sh's FIRST act is to run run-wire.sh, so the D59 CreateAtomic
      # bridge and the R4 lockstep are one invocation, not two. Calling the
      # script rather than transcribing its steps is deliberate: the script is
      # the gate, and a yml copy of its contents would be a second gate free to
      # drift from the first.
      - name: verify/catalog/run-r4.sh (runs run-wire.sh first)
        run: bash verify/catalog/run-r4.sh 2>&1 | tee r4-gate.log

      - name: Upload bridge output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bridge-r4-${{ github.run_id }}-${{ github.run_attempt }}
          path: r4-gate.log
          if-no-files-found: warn
          retention-days: 90

  windows-r4:
    name: PowerShell wire + R4 twins (Windows)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # This invokes the PowerShell gate itself rather than copying its TLC
      # command into YAML. The cap2 count, honest refinement, and faithless
      # refutation are the common semantic anchors shared with run-wire.sh.
      - name: verify/catalog/run-r4.ps1 (runs run-wire.ps1 first)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-logs" | Out-Null
          & "$env:GITHUB_WORKSPACE\verify\catalog\run-r4.ps1" *>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\ci-logs\windows-r4.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload PowerShell wire output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-r4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/windows-r4.log
          if-no-files-found: warn
          retention-days: 90
