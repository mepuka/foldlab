\* Induction with SelfInterleave = TRUE: one identity may run concurrent
\* workers (an owner acts while its own commit is paused) — the regime of
\* the audit's single-owner counterexample, and strictly MORE behaviors
\* than the sequential model.  Checked against IndInvIdentityFree, which
\* assumes nothing about process identity.  FenceCap = 0: unbounded.
CONSTANTS
  NumOwners = 3
  TwoKey = FALSE
  AdversarialSteal = TRUE
  SelfInterleave = TRUE
  AllowCrash = TRUE
  FenceCap = 0
INIT Init
NEXT Next
