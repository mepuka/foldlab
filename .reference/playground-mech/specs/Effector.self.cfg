\* Self-interleave configuration: one identity may run concurrent workers
\* (the audit's single-owner-counterexample regime), single-key protocol,
\* closure under generation cap 3.  The distinct-state count is cross-
\* checked for exact set equality against the TS model in
\* tlc.parity.test.ts.
SPECIFICATION Spec
CONSTANTS
  NumOwners = 3
  TwoKey = FALSE
  AdversarialSteal = TRUE
  SelfInterleave = TRUE
  AllowCrash = TRUE
  FenceCap = 3
INVARIANTS TypeOK TerminalFenceIsMaximal
PROPERTIES FencingSafety UniqueTerminalOutcome GenerationsAreMonotone
