# NO `gen:workbench` TASK, and the reason changed. It used to be that
# nothing under experiments/workbench was derived from a declared source.
# Three files now are — `src/generated/WordLogSchema.ts`,
# `src/generated/kindTags.ts` and `src/generated/grammar/names.json` —
# and they are still not a task of their own, because a task is not the
# unit here. `lake exe emitword` and `lake exe emitgrammar` each write
# BOTH packages' copies in ONE run, off one registry, so the workbench's
# mirrors are outputs of `gen:backend-word` and `gen:grammar-manifest`
# and are listed there. Three reasons a second task would be worse, not
# better:
#
#   1. It would re-run the same executable, doing the same work twice
#      and writing the same bytes twice per `gen`.
#   2. `tools/EnvLedger.lean` joins each `[[lean_exe]]` to the task that
#      runs it bare (`drives`) and to the `--check` that gates it
#      (`gates`), taking the FIRST match. Two tasks running `lake exe
#      emitword` makes `declaredOutputs` depend on the order of this
#      file — precisely the drift the ledger exists to report.
#   3. The zero-duplication spellings are unavailable by design: the
#      ledger's TOML door reads `description`, `dir`, `run`, `sources`,
#      `outputs` and REFUSES any other task key, so `depends` or an
#      alias would red the environment gate rather than wire anything.
#
# The `check:cas` batch already gates both mirrors for the same reason:
# `emitword --check` and `emitgrammar --check` visit every fixture their
# tool declares, and the workbench's are fixtures. What that batch DID
# need is the mirrors in its `sources` — see the note there.
#
# The README's law is unchanged and is why these three exist at all:
# any surface the store language already describes is generated, never
# typed by hand. The next such surface joins the emitter that already
# owns it, the same way.

# THE DEV LANE'S ONE COMMAND. `check:workbench` is the gate; this is the
# loop you sit in while writing the thing the gate will judge. It is a
# task and not only a package script for the reason every other entry
# point here is one: the runner is mise, and somebody who has read
# AGENTS.md and nothing else should not have to learn which directory
# the front end lives in before they can start it.
#
# It opens the TRUNK DEV FIXTURE VIEWER rather than the app root,
# because that is the surface with something on it: the recorded
# 220-receipt fixture rendered through the real engine (workbench
# README, "Dev fixture viewer"). The app root is one click away at `/`
# on the same server. The route itself is spelled ONCE, in the
# package's own `dev:fixture` script, so this file does not carry a
# second copy of a path that can drift.
#
# The frozen install runs first on purpose: the lane starts from the
# pinned tree or it does not start, the same contract `check:workbench`
# opens with, at a cost of about 50 ms when nothing has moved.
#
# NOT A GATE, and the ledger already says so. `dev` is unreachable from
# `check` and `check:ci`, so `gen:env-ledger` files it under
# `excludedGates` with the rest of what CI does not run — correctly: a
# server that runs until you stop it has no verdict to give. It carries
# no `sources`/`outputs` for the same reason, so it is never skipped as
# fresh.
[tasks.dev]
description = "The workbench dev server, opened on the trunk dev fixture viewer (Vite + @foldkit/vite-plugin, so a hot update preserves the Model)"
dir = "{{config_root}}/experiments/workbench"
run = [
  "bun install --frozen-lockfile",
  "bun run dev:fixture",
]

[tasks."check:extract-twin"]
description = """
STANDING EXCEPTION — manual gate, deliberately outside `mise run check`. Reviewed \
2026-08-29 against M3 of the ingestion-harness report; vendoring was priced and refused. \
Stage 1 cross-instrument gate: TS-compiler-API extractor vs lean4-tree-sitter twin. \
WHY IT STAYS MANUAL: (1) `extract-lean/lakefile.toml` requires the lean4-tree-sitter \
package by path out of a gitignored clone, and that package's `extern_lib` links ALL TEN \
vendored grammars unconditionally — 111 MB of generated C — so the vendoring is the whole \
seam, not the TypeScript slice; (2) the clone pins `leanprover/lean4:v4.32.0` against an \
estate-wide v4.33.1, so vendoring the C would not remove the elan network fetch anyway, \
and the toolchain split is itself unruled (grill item 3); (3) building only the \
TypeScript grammar means editing an admitted third party's lakefile, which is a \
re-admission event, not a wiring change. WHAT WOULD CHANGE THIS: the twin bumped to \
v4.33.1 with a lean4-tree-sitter re-admission, or an upstream release that makes the \
grammar set selectable — either removes the standing exception and this task joins the \
chain. Until then run it by hand after any change to the extractor, the walk, or the pins.\
"""
