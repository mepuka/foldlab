# `lake build` first, and it is not belt-and-braces. `lake exe strata`
# builds only the executable's own import closure — three modules — while
# the gate imports EVERY member module the lakefile declares, and a
# member with no `.olean` is a refusal naming it (verified). The four
# default targets (`Cas`, `CasBackend`, `CasExamples`, `CasWp`) are
# exactly the walked set, so this line is what makes the task correct
# from a cold `.lake`; it costs ~0.2 s warm. `check:cas:surface` and its
# two siblings run the same line for the same reason.
run = [
  "lake build",
  "lake exe strata",
]

