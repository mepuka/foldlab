# THE GATE LOOP.
#
# Two shapes changed here, both measured, neither weakening a gate.
#
# BATCHING. `lake exe X` pays ~400 ms of wrapper before X's own work
# begins (measured on this host; the study measured 283 ms on the main
# tree). Thirteen of those was 6.78 s of a loop whose real work is
# 1.55 s. `lake env sh -c` pays the environment setup ONCE and then
# invokes the built binaries directly, so the thirteen fast gates now
# cost what they actually do. Every gate still runs, in the same order,
# and `set -e` stops at the first red one exactly as separate `run`
# lines did. The binaries are spelled out one per gate rather than
# looped, deliberately: `meta/out/environment.META.json` joins each
# `[[lean_exe]]` to the command that gates it, and a loop would hide
# every name from that join and land all thirteen in `ungated`.
#
# THE SPLIT. `surface` (8.18 s) and `obligations` (4.98 s) are 70% of
# this task's real work and are the only two `supportInterpreter`
# executables — their cost is `importModules`, not their own logic.
# They are their own tasks so they cache on their own sources instead of
# being re-paid whenever any other gate's input moves. NOTE against the
# study, which names `surface` as the only `supportInterpreter` exe and
# 77% of the work: `obligations` landed with the same flag afterwards,
# so the split covers both.
#
# SOURCES INCLUDE THE FIXTURES. A byte gate's whole job is to notice a
# hand-edited artifact, so every artifact it checks is one of its
# sources. Declaring only the Lean tree would let a hand-edited fixture
# leave the gate "fresh" and skipped — the gate would stop being able to
# fail. This is the one declaration on this task that is load-bearing
# rather than an optimization.
#
# THE STRATA GATE IS IN THE BATCH, not split off like the three ledgers
# above, and the reason is measured rather than assumed. The split
# exists because `surface` (8.18 s) and `obligations` (4.98 s) pay
# `importModules` WITH extensions and then pretty-print every
# declaration in the library; `strata` imports the same modules with
# `loadExts := false` and reads nothing but the header's import graph,
# which measures 0.25–0.74 s of render time — the same order as the
# batch's other gates and an order of magnitude under the split ones.
# Its sources are also already this task's sources (the Lean tree plus
# `lakefile.toml`, its membership authority), so a task of its own would
# buy a cache worth a quarter of a second and cost a task nobody needs.
# If it ever grows a walk that costs what `surface` costs, it splits on
# the same measured argument.
[tasks."check:cas"]
description = "Build the CAS type model under --wfail and run the vector, schema, conformance-verdict, admission-map, wire-mirror, word-wire, admission-table, architecture, program + lift-document, layer, materialization, MCP-manifest, lift-manifest, grammar-manifest, environment-ledger, and strata byte-identity gates (the supportInterpreter ledgers are check:cas:surface, check:cas:obligations, and check:cas:laws)"
dir = "{{config_root}}/library/cas"
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "vectors/**", "schemas/**", "conformance/**", "mcp/**", "REGISTRY.md",
  "../effects/src/cas/generated/**", "../effects/test/generated/**",
  # The workbench's mirrors are fixtures of `emitword` and `emitgrammar`
  # like every other, so they are sources of the gate that checks them:
  # a hand-edited mirror must not leave this task "fresh" and skipped.
  "../../experiments/workbench/src/generated/**",
  "meta/out/environment.META.json",
  "meta/out/strata.META.json",
  "../../experiments/entity-store-extract/inventory.json",
]
run = [
  "lake --wfail build Cas CasBackend CasExamples vectors schemas verdicts admissionmap emitwire emitword emitgate emitarchitecture emitprograms emitlayers materialize mcpspec emitlift emitgrammar envledger strata surface obligations laws",
  "lake env sh -c 'set -e; .lake/build/bin/vectors --check; .lake/build/bin/schemas --check; .lake/build/bin/verdicts --check; .lake/build/bin/admissionmap --check; .lake/build/bin/emitwire --check; .lake/build/bin/emitword --check; .lake/build/bin/emitgate --check; .lake/build/bin/emitarchitecture --check; .lake/build/bin/emitprograms --check; .lake/build/bin/emitlayers --check; .lake/build/bin/materialize --check; .lake/build/bin/mcpspec --check; .lake/build/bin/emitlift --check; .lake/build/bin/emitgrammar --check; .lake/build/bin/envledger --check; .lake/build/bin/strata --check'",
  "mise run check:cas:surface",
  "mise run check:cas:obligations",
  "mise run check:cas:laws",
]

