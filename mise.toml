[tasks."gen:env-ledger"]
description = "Regenerate the environment ledger (mise tool pins and task graph, every lean-toolchain pin, the lean_exe/task join) from the config files themselves"
dir = "{{config_root}}/library/cas"
# The configuration plane's emitter reads CONFIG FILES, not the compiled
# library — so its real inputs are `mise.toml` (this file, which mise
# also adds automatically as the task definition), this package's
# `lakefile.toml`, and every `lean-toolchain` in the estate. The
# toolchain list is spelled out rather than globbed because
# `tools/EnvLedger.lean` already declares exactly these eight as a Lean
# constant: a `**` walk would also descend `.lake` build trees, and the
# two lists disagreeing is precisely the drift the ledger exists to
# catch. The Lean globs stay because the tool itself is Lean.
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "../../mise.toml",
  "../../experiments/entity-store-extract/twin/extract-lean/lean-toolchain",
  "../../experiments/entity-store-generate/generated/lean-toolchain",
  "../../experiments/entity-store-model/lean-toolchain",
  "../../experiments/entity-store-shell/lean-toolchain",
  "../../formal/fips202/lean-toolchain",
  "../../library/effects/archive/lean-model-0.3/lean-toolchain",
  "../../library/machine/lean-toolchain",
]
outputs = ["../../docs/lab-core/ENVIRONMENT.json"]
run = "lake exe envledger"

# THE GATE LOOP.
#
# Two shapes changed here, both measured, neither weakening a gate.
#
# BATCHING. `lake exe X` pays ~400 ms of wrapper before X's own work
# begins (measured on this host; the study measured 283 ms on the main
# tree). Thirteen of those was 6.78 s of a loop whose real work is
# 1.55 s. `lake env sh -c` pays the environment setup ONCE and then
# invokes the built binaries directly, so the thirteen fast gates now
# cost what they actually do. Every gate still runs, in the same order,
# and `set -e` stops at the first red one exactly as separate `run`
# lines did. The binaries are spelled out one per gate rather than
# looped, deliberately: `docs/lab-core/ENVIRONMENT.json` joins each
# `[[lean_exe]]` to the command that gates it, and a loop would hide
# every name from that join and land all thirteen in `ungated`.
#
# THE SPLIT. `surface` (8.18 s) and `obligations` (4.98 s) are 70% of
# this task's real work and are the only two `supportInterpreter`
# executables — their cost is `importModules`, not their own logic.
# They are their own tasks so they cache on their own sources instead of
# being re-paid whenever any other gate's input moves. NOTE against the
# study, which names `surface` as the only `supportInterpreter` exe and
# 77% of the work: `obligations` landed with the same flag afterwards,
# so the split covers both.
#
# SOURCES INCLUDE THE FIXTURES. A byte gate's whole job is to notice a
# hand-edited artifact, so every artifact it checks is one of its
# sources. Declaring only the Lean tree would let a hand-edited fixture
# leave the gate "fresh" and skipped — the gate would stop being able to
# fail. This is the one declaration on this task that is load-bearing
# rather than an optimization.
[tasks."check:cas"]
description = "Build the CAS type model under --wfail and run the vector, schema, conformance-verdict, admission-map, wire-mirror, admission-table, program + lift-document, layer, materialization, MCP-manifest, lift-manifest, grammar-manifest, and environment-ledger byte-identity gates (the supportInterpreter ledgers are check:cas:surface, check:cas:obligations, and check:cas:laws)"
dir = "{{config_root}}/library/cas"
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "vectors/**", "schemas/**", "conformance/**", "mcp/**", "REGISTRY.md",
  "../effects/src/cas/generated/**", "../effects/test/generated/**",
  "../../docs/lab-core/ENVIRONMENT.json",
  "../../experiments/entity-store-extract/inventory.json",
]
run = [
  "lake --wfail build Cas CasBackend CasExamples vectors schemas verdicts admissionmap emitwire emitgate emitprograms emitlayers materialize mcpspec emitlift emitgrammar envledger surface obligations laws",
  "lake env sh -c 'set -e; .lake/build/bin/vectors --check; .lake/build/bin/schemas --check; .lake/build/bin/verdicts --check; .lake/build/bin/admissionmap --check; .lake/build/bin/emitwire --check; .lake/build/bin/emitgate --check; .lake/build/bin/emitprograms --check; .lake/build/bin/emitlayers --check; .lake/build/bin/materialize --check; .lake/build/bin/mcpspec --check; .lake/build/bin/emitlift --check; .lake/build/bin/emitgrammar --check; .lake/build/bin/envledger --check'",
  "mise run check:cas:surface",
  "mise run check:cas:obligations",
  "mise run check:cas:laws",
]

[tasks."check:cas:surface"]
description = "The surface-ledger byte-identity gate — split from check:cas because `surface` is a supportInterpreter executable whose importModules cost dominates the loop, and so caches on its own sources"
dir = "{{config_root}}/library/cas"
sources = [
