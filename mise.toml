# No `gen:workbench` task yet, deliberately. Nothing in
# experiments/workbench is derived from a declared source: the page is
# hand-written because there is nothing to generate it from. The moment a
# surface arrives that the store language already describes — the MCP tool
# manifest, the canonical schemas, the wire profile — its TypeScript is
# emitted by a task here and never typed by hand.

[tasks."check:extract-twin"]
description = """
STANDING EXCEPTION — manual gate, deliberately outside `mise run check`. Reviewed \
2026-08-29 against M3 of the ingestion-harness report; vendoring was priced and refused. \
Stage 1 cross-instrument gate: TS-compiler-API extractor vs lean4-tree-sitter twin. \
WHY IT STAYS MANUAL: (1) `extract-lean/lakefile.toml` requires the lean4-tree-sitter \
package by path out of a gitignored clone, and that package's `extern_lib` links ALL TEN \
vendored grammars unconditionally — 111 MB of generated C — so the vendoring is the whole \
seam, not the TypeScript slice; (2) the clone pins `leanprover/lean4:v4.32.0` against an \
estate-wide v4.33.1, so vendoring the C would not remove the elan network fetch anyway, \
and the toolchain split is itself unruled (grill item 3); (3) building only the \
TypeScript grammar means editing an admitted third party's lakefile, which is a \
re-admission event, not a wiring change. WHAT WOULD CHANGE THIS: the twin bumped to \
v4.33.1 with a lean4-tree-sitter re-admission, or an upstream release that makes the \
grammar set selectable — either removes the standing exception and this task joins the \
chain. Until then run it by hand after any change to the extractor, the walk, or the pins.\
"""
dir = "{{config_root}}/experiments/entity-store-extract/twin"
run = [
  "bash bootstrap.sh",
  "bash -c 'cd extract-lean && lake build'",
  "bash -c 'cd harness && bun install --frozen-lockfile && bun run check'",
]

# TYPECHECKER: tsgo (@typescript/native-preview, TS7), per the 2026-08-28 ruling. The
# `typescript@5.9.2` dependency stays: it is the compiler-API LEG's parser, which this
# gate uses only as the offline differential, never on the hot path.
#
# Not in the default `check` chain, for one reason and it is the lane's standing one:
# every input lives under gitignored `.staging/e2/src-cache` and no bootstrap script
# materializes it (INGESTION-HARNESS.md M1, grill item 1). The gate is host-local until
# that is ruled; it is wired here so it is one command, not a procedure in a report.
[tasks."check:extract-oxc"]
description = "Stage 1 oxc gate: all six pinned rc.111 files parse with ZERO errors, and the oxc leg's inventory is byte-identical to the committed one (instrument fields normalized) — the two files the tree-sitter twin cannot read included"
dir = "{{config_root}}/experiments/entity-store-extract"
run = [
  "bun install --frozen-lockfile",
  "bun x tsgo --noEmit",
  "bun x vitest run",
  "bun test test/extract.test.ts",
  "bun run src/oxc-check.ts",
]

[tasks."gen:oxc-surface"]
description = "Regenerate experiments/entity-store-extract/oxc-surface.json — the oxc leg's census of the full six-file surface (parse cleanliness, declaration histogram, and every declaration the tree-sitter grammar cannot read)"
dir = "{{config_root}}/experiments/entity-store-extract"
# DELIBERATELY UNDECLARED — the one gen task with no `sources`/`outputs`,
# and the reason is the same standing exception that keeps it out of the
# `gen` chain and marks it `host-local` in the environment ledger. Its
# dominant input is the full six-file pinned source cache under
# `.staging/e2/src-cache`, which is gitignored, has no bootstrap, and is
# found by walking ANCESTOR directories — so its path is not even stable
# between a checkout and a worktree. Declaring only the in-repo half
# would buy a skip whose freshness relation cannot see the input that
# actually decides the output bytes. An undeclared task always runs,
# which is the correct answer here. This becomes declarable when the
# source cache gets a committed bootstrap (INGESTION-HARNESS.md M1).
run = "bun run src/oxc-extract.ts"
