[tasks."gen:grammar-manifest"]
description = "Regenerate the data grammar's sort table (JSON for the front ends, REGISTRY.md for humans, the door's refusal set and the derived-name inventory for both TypeScript packages) from the Lean grammar manifest (authority: Cas.Grammar.manifestV0)"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = [
  "../effects/src/cas/generated/grammar/manifest.json",
  "../effects/src/cas/generated/grammar/kindTags.ts",
  "../effects/src/cas/generated/grammar/refMarkers.ts",
