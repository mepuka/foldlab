[tools]
bun = "1.4.0"
node = "22.23.2"

[tasks.gen]
description = "Regenerate every derived file from declared sources"
run = [
  "mise run gen:inventory",
  "mise run gen:vectors",
  "mise run gen:cas-vectors",
  "mise run gen:cas-schemas",
  "mise run gen:cas-verdicts",
  "mise run gen:cas-admission-map",
  "mise run gen:backend-wire",
  "mise run gen:backend-gate",
  "mise run gen:backend-programs",
  "mise run gen:backend-layers",
  "mise run gen:backend-mcp",
  "mise run gen:backend-materialize",
  "mise run gen:effects-materialize",
  "mise run gen:lift-manifest",
  "mise run gen:grammar-manifest",
  "mise run gen:cas-surface",
  "mise run gen:cas-obligations",
  "mise run gen:cas-laws",
  "mise run gen:env-ledger",
  "mise run gen:ledger",
]

[tasks."gen:inventory"]
description = "Stage 1 (EXT-6): re-extract inventory.json from the vendored pinned Effect sources"
dir = "{{config_root}}/experiments/entity-store-extract"
run = "bun run src/extract.ts"

[tasks."gen:vectors"]
description = "Regenerate the golden-vector corpus and transcripts from the oracle (CV-1 bundle raw material)"
dir = "{{config_root}}/experiments/entity-store-shell"
run = [
  "lake exe estore-vectors vectors",
  "git clean -qxfd .harness-work",
  "lake exe harness harness .harness-work --record transcripts",
]

[tasks."gen:ledger"]
description = "Regenerate docs/entity-store/LEDGER.md by fresh extraction (PROCEDURE §8)"
dir = "{{config_root}}/experiments/entity-store-ledger"
run = "bun run gen"

[tasks."check:fips202"]
description = "Build and replay the promoted fips202 Lean artifact"
dir = "{{config_root}}/formal/fips202"
run = [
  "lake --wfail build",
  "lake env leanchecker --fresh Sha3.Bridge",
]

[tasks."check:entity-store"]
description = "Build the E2 model with its opaque/unsafe gate and axiom reports"
dir = "{{config_root}}/experiments/entity-store-model"
run = "lake --wfail build"

[tasks."check:machine"]
description = "Build the machine library under --wfail"
dir = "{{config_root}}/library/machine"
run = "lake --wfail build"

[tasks."gen:cas-vectors"]
description = "Regenerate the CAS conformance vectors from the Lean registry"
dir = "{{config_root}}/library/cas"
run = "lake exe vectors"

[tasks."gen:cas-schemas"]
description = "Regenerate the canonical-schema payload fixtures from the Lean self-codec registry"
dir = "{{config_root}}/library/cas"
run = "lake exe schemas"

[tasks."gen:cas-verdicts"]
description = "Regenerate the two-doors conformance corpus (code/value/verdict triples) by executing the Lean model"
dir = "{{config_root}}/library/cas"
run = "lake exe verdicts"

[tasks."gen:cas-admission-map"]
description = "Regenerate the ACC-1 carrier-adequacy table (every Representation variant's admission verdict) from Cas.Schema.admissionMapV0"
dir = "{{config_root}}/library/cas"
run = "lake exe admissionmap"

[tasks."gen:backend-wire"]
description = "Regenerate the effects package's generated canonical-schema mirrors from the Lean codes"
dir = "{{config_root}}/library/cas"
run = "lake exe emitwire"

[tasks."gen:backend-gate"]
description = "Regenerate the effects package's admission table (what the schema door admits, as data) from the Lean manifest"
dir = "{{config_root}}/library/cas"
run = "lake exe emitgate"

[tasks."gen:backend-programs"]
description = "Regenerate the straight-line Effect programs of the registered grammar terms, and the lift documents the recognizer must answer for them (P3's Lean half)"
dir = "{{config_root}}/library/cas"
run = "lake exe emitprograms"

[tasks."gen:backend-layers"]
description = "Regenerate the Effect layers lowered from the authored service topology (G6-a)"
dir = "{{config_root}}/library/cas"
run = "lake exe emitlayers"

[tasks."gen:backend-mcp"]
description = "Regenerate the versioned CAS MCP tool manifest from the signatures"
dir = "{{config_root}}/library/cas"
run = "lake exe mcpspec"

[tasks."gen:lift-manifest"]
description = "Regenerate the effect-lift rule manifest (JSON + Markdown projections) from the Lean lift data (authority: Cas.Lift.manifestV0)"
dir = "{{config_root}}/library/cas"
run = "lake exe emitlift"

[tasks."gen:grammar-manifest"]
description = "Regenerate the data grammar's sort table (JSON for the front ends, REGISTRY.md for humans) from the Lean grammar manifest (authority: Cas.Grammar.manifestV0)"
dir = "{{config_root}}/library/cas"
run = "lake exe emitgrammar"

[tasks."gen:backend-materialize"]
description = "Regenerate the estate-native materialized modules (P6's second register) from the committed schema payloads"
dir = "{{config_root}}/library/cas"
run = "lake exe materialize"

[tasks."gen:effects-materialize"]
description = "Regenerate the Effect-native materialized modules (Materialize.source's committed snapshots)"
dir = "{{config_root}}/library/effects"
run = "bun scripts/gen-materialized.ts"

[tasks."gen:cas-surface"]
description = "Regenerate the Cas surface ledger (per-declaration signatures, doc coverage, axiom census) from the compiled environment"
dir = "{{config_root}}/library/cas"
run = "lake exe surface"

[tasks."gen:cas-obligations"]
description = "Regenerate the Cas obligation ledger (the named obligations written in the docstrings, plus the health counters) from the compiled environment"
dir = "{{config_root}}/library/cas"
run = "lake exe obligations"

[tasks."gen:cas-laws"]
description = "Regenerate the law index (the ruling registry joined to the LAW lines the enforcing declarations carry) from the compiled environment"
dir = "{{config_root}}/library/cas"
run = "lake exe laws"

[tasks."gen:env-ledger"]
description = "Regenerate the environment ledger (mise tool pins and task graph, every lean-toolchain pin, the lean_exe/task join) from the config files themselves"
dir = "{{config_root}}/library/cas"
run = "lake exe envledger"

[tasks."check:cas"]
description = "Build the CAS type model under --wfail and run the vector, schema, conformance-verdict, admission-map, wire-mirror, admission-table, program + lift-document, layer, materialization, MCP-manifest, lift-manifest, grammar-manifest, surface-ledger, obligation-ledger, law-index, and environment-ledger byte-identity gates"
dir = "{{config_root}}/library/cas"
run = [
  "lake --wfail build",
  "lake exe vectors --check",
  "lake exe schemas --check",
  "lake exe verdicts --check",
  "lake exe admissionmap --check",
  "lake exe emitwire --check",
  "lake exe emitgate --check",
  "lake exe emitprograms --check",
  "lake exe emitlayers --check",
  "lake exe materialize --check",
  "lake exe mcpspec --check",
  "lake exe emitlift --check",
  "lake exe emitgrammar --check",
  "lake exe surface --check",
  "lake exe obligations --self-test",
  "lake exe obligations --check",
  "lake exe laws --self-test",
  "lake exe laws --check",
  "lake exe envledger --check",
]

[tasks."check:effects:archive"]
description = "Build the RETIRED effects-model@0.3.0 corpus and run its frozen gates (manual; not in CI)"
dir = "{{config_root}}/library/effects/archive/lean-model-0.3"
run = [
  "lake --wfail build",
  "lake exe conformance_ledger CONFORMANCE-LEDGER.md",
  "lake exe conformance_manifest conformance/manifest",
  "bun scripts/check-ledger-transitions.ts",
  "bun scripts/check-mutant-quarantine.ts",
  "lake exe conformance_mutation",
  "git diff --exit-code -- CONFORMANCE-LEDGER.md conformance/manifest",
]

[tasks."gen:effects:archive"]
description = "Regenerate the RETIRED corpus's ledger and manifests (must stay byte-identical at 0.3.0)"
dir = "{{config_root}}/library/effects/archive/lean-model-0.3"
run = [
  "lake exe conformance_ledger CONFORMANCE-LEDGER.md",
  "lake exe conformance_manifest conformance/manifest",
]

[tasks."brief:effects:archive"]
description = "Print the RETIRED corpus's lane briefing"
dir = "{{config_root}}/library/effects/archive/lean-model-0.3"
run = "lake exe conformance_brief"

[tasks."gen:effects:research"]
description = "Refresh the effects research/docs snapshots from their canonical owners"
dir = "{{config_root}}/library/effects"
run = "bun scripts/sync-research.ts --write"

[tasks."check:effects:research"]
description = "Assert the effects research/docs snapshots are byte-equal to their canonical owners"
dir = "{{config_root}}/library/effects"
run = "bun scripts/sync-research.ts"

[tasks."check:effects:ts"]
description = "Frozen install, typecheck, test, build, and consumer-smoke the effects TypeScript package"
dir = "{{config_root}}/library/effects"
run = [
  "bun scripts/check-src-purity.ts",
  "bun install --frozen-lockfile",
  "bun run lint",
  "bun run typecheck",
  "bun run test",
  "bun run build",
  "bun scripts/check-dist-consumer.ts",
]

[tasks."check:extract"]
description = "Stage 1 gate (EXT-6): pin verification, the four-way enumeration agreement, and byte-determinism"
dir = "{{config_root}}/experiments/entity-store-extract"
run = [
  "bun install --frozen-lockfile",
  "bun test",
]

[tasks."check:generate"]
description = "Stage 2 gate: regenerated Lean tree byte-equal to the committed one, then lake build"
dir = "{{config_root}}/experiments/entity-store-generate"
run = [
  "bun test",
  "bun run check",
]

[tasks."check:ledger"]
description = "Both packages green, harness green, committed LEDGER.md byte-equal to a fresh extraction"
dir = "{{config_root}}/experiments/entity-store-ledger"
run = [
  "bun test",
  "bun run check",
]

[tasks.check]
description = "gen + clean-tree assertion + tests and gates (what CI runs)"
run = [
  "mise run gen",
  "git diff --exit-code",
  "mise run check:fips202",
  "mise run check:entity-store",
  "mise run check:extract",
  "mise run check:generate",
  "mise run check:machine",
  "mise run check:cas",
  "mise run check:effects:ts",
  "mise run check:effects:research",
  "mise run check:ledger",
]

[tasks."check:lift-roundtrip"]
description = "P3: the recognition leg of the PProg round trip — the harness reading the committed emitted programs must answer the committed lift documents byte for byte (not in the default check chain: experiments/lift-harness/bun.lock does not resolve under bun 1.4.0, so `--frozen-lockfile` is red before the test runs)"
dir = "{{config_root}}/experiments/lift-harness"
run = [
  "bun install --frozen-lockfile",
  "bun x vitest run test/T12-roundtrip.test.ts",
]

[tasks."check:extract-twin"]
description = """
STANDING EXCEPTION — manual gate, deliberately outside `mise run check`. Reviewed \
2026-08-29 against M3 of the ingestion-harness report; vendoring was priced and refused. \
Stage 1 cross-instrument gate: TS-compiler-API extractor vs lean4-tree-sitter twin. \
WHY IT STAYS MANUAL: (1) `extract-lean/lakefile.toml` requires the lean4-tree-sitter \
package by path out of a gitignored clone, and that package's `extern_lib` links ALL TEN \
vendored grammars unconditionally — 111 MB of generated C — so the vendoring is the whole \
seam, not the TypeScript slice; (2) the clone pins `leanprover/lean4:v4.32.0` against an \
estate-wide v4.33.1, so vendoring the C would not remove the elan network fetch anyway, \
and the toolchain split is itself unruled (grill item 3); (3) building only the \
TypeScript grammar means editing an admitted third party's lakefile, which is a \
re-admission event, not a wiring change. WHAT WOULD CHANGE THIS: the twin bumped to \
v4.33.1 with a lean4-tree-sitter re-admission, or an upstream release that makes the \
grammar set selectable — either removes the standing exception and this task joins the \
chain. Until then run it by hand after any change to the extractor, the walk, or the pins.\
"""
dir = "{{config_root}}/experiments/entity-store-extract/twin"
run = [
  "bash bootstrap.sh",
  "bash -c 'cd extract-lean && lake build'",
  "bash -c 'cd harness && bun install --frozen-lockfile && bun run check'",
]

# TYPECHECKER: tsgo (@typescript/native-preview, TS7), per the 2026-08-28 ruling. The
# `typescript@5.9.2` dependency stays: it is the compiler-API LEG's parser, which this
# gate uses only as the offline differential, never on the hot path.
#
# Not in the default `check` chain, for one reason and it is the lane's standing one:
# every input lives under gitignored `.staging/e2/src-cache` and no bootstrap script
# materializes it (INGESTION-HARNESS.md M1, grill item 1). The gate is host-local until
# that is ruled; it is wired here so it is one command, not a procedure in a report.
[tasks."check:extract-oxc"]
description = "Stage 1 oxc gate: all six pinned rc.111 files parse with ZERO errors, and the oxc leg's inventory is byte-identical to the committed one (instrument fields normalized) — the two files the tree-sitter twin cannot read included"
dir = "{{config_root}}/experiments/entity-store-extract"
run = [
  "bun install --frozen-lockfile",
  "bun x tsgo --noEmit",
  "bun x vitest run",
  "bun test test/extract.test.ts",
  "bun run src/oxc-check.ts",
]

[tasks."gen:oxc-surface"]
description = "Regenerate experiments/entity-store-extract/oxc-surface.json — the oxc leg's census of the full six-file surface (parse cleanliness, declaration histogram, and every declaration the tree-sitter grammar cannot read)"
dir = "{{config_root}}/experiments/entity-store-extract"
run = "bun run src/oxc-extract.ts"
