dir = "{{config_root}}/library/cas"
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "surface/cas-laws.json", "SCHEMA-MATERIALIZATION.md",
