[tools]
bun = "1.4.0"
node = "22.23.2"

[settings]
# THE BUILD RELATION (BS1). Every `gen:*` task below declares `sources`
# and `outputs`; mise skips a task whose outputs are fresh for its
# sources. Three things make that safe to trust, and all three are
# load-bearing:
#
# 1. `sources` are OVER-declared — whole-tree globs, not the precise
#    input set. Under-declaration is the one hazard that matters: a
#    source outside the glob changes, the emitter is skipped, and
#    `git diff --exit-code` is vacuously clean while the fixture is
#    wrong. Over-declaration costs only stats.
# 2. Freshness is CONTENT, not mtime. mise's default relation is
#    `max(source mtime) < max(output mtime)`; the setting below
#    replaces it with a blake3 hash over source contents. The estate
#    does not get to have a freshness relation weaker than its identity
#    relation. This is not a refinement — see `check:ci` below for the
#    measured reason it is mandatory.
# 3. Hand edits are still caught. A hand-edited fixture is a `git diff`,
#    and `[tasks.check]` still runs `git diff --exit-code` whether or
#    not any emitter ran.
task.source_freshness_hash_contents = true

# REFUSED, by name, so nobody adopts it later as an obvious-looking win:
# mise's experimental per-task remote cache (`[tasks.X.cache]` with
# `task.cache.remote_url`). It is a real content-addressed action cache,
# and the estate will not use it. Its own documentation states the
# reason: A CHECKSUM IS NOT A SIGNATURE FROM THE ORIGINAL TASK RUNNER —
# anyone who can write a namespace publishes entries readers trust. The
# estate's addressing is strictly better at exactly that seam: every
# object is admitted by recomputing its digest and re-verified at load,
# so a wrong answer fails admission at the receiving seam rather than at
# a trust boundary, and no signing plane is required or wanted. If a
# shared build cache is ever needed, it is `cas-http/0`, not this.
# (Study: .staging/operational-structure/BUILD-SEMANTICS.md §2, §5, ask 7.)

[tasks.gen]
description = "Regenerate every derived file from declared sources"
run = [
  "mise run gen:inventory",
  "mise run gen:vectors",
  "mise run gen:cas-vectors",
  "mise run gen:cas-schemas",
  "mise run gen:cas-verdicts",
  "mise run gen:cas-admission-map",
  "mise run gen:backend-wire",
  "mise run gen:backend-word",
  "mise run gen:backend-gate",
  "mise run gen:backend-architecture",
  "mise run gen:backend-programs",
  "mise run gen:backend-layers",
  "mise run gen:backend-mcp",
  "mise run gen:backend-materialize",
  "mise run gen:effects-materialize",
  "mise run gen:effects:research",
  "mise run gen:lift-manifest",
  "mise run gen:grammar-manifest",
  "mise run gen:cas-surface",
  "mise run gen:cas-obligations",
  "mise run gen:cas-laws",
  "mise run gen:debts",
  "mise run gen:axioms",
  "mise run gen:meta",
  "mise run gen:trust",
  "mise run gen:strata",
  "mise run gen:env-ledger",
  "mise run gen:ledger",
]

# The forced mirror of `gen`, for `check:ci`. It exists because
# `--force` does not propagate into nested `mise run` lines, so the only
# way to force a chain is to spell it on every line of the chain.
#
# The obvious hazard is drift: a new emitter added to `gen` and
# forgotten here would be silently unforced in CI — exactly the failure
# this task exists to prevent, reintroduced one line higher up. So it is
# not left to vigilance. `tools/EnvLedger.lean` REFUSES to emit the
# environment ledger unless every task in `gen`'s chain has a
# `mise run --force` counterpart here, which makes the omission a red
# gate at the moment it is committed rather than a quiet green in CI.
[tasks."gen:ci"]
description = "Regenerate every derived file, FORCED — the CI half of `gen`, kept line-for-line in step with it by the environment ledger's refusal"
run = [
  "mise run --force gen:inventory",
  "mise run --force gen:vectors",
  "mise run --force gen:cas-vectors",
  "mise run --force gen:cas-schemas",
  "mise run --force gen:cas-verdicts",
  "mise run --force gen:cas-admission-map",
  "mise run --force gen:backend-wire",
  "mise run --force gen:backend-word",
  "mise run --force gen:backend-gate",
  "mise run --force gen:backend-architecture",
  "mise run --force gen:backend-programs",
  "mise run --force gen:backend-layers",
  "mise run --force gen:backend-mcp",
  "mise run --force gen:backend-materialize",
  "mise run --force gen:effects-materialize",
  "mise run --force gen:effects:research",
  "mise run --force gen:lift-manifest",
  "mise run --force gen:grammar-manifest",
  "mise run --force gen:cas-surface",
  "mise run --force gen:cas-obligations",
  "mise run --force gen:cas-laws",
  "mise run --force gen:debts",
  "mise run --force gen:axioms",
  "mise run --force gen:meta",
  "mise run --force gen:trust",
  "mise run --force gen:strata",
  "mise run --force gen:env-ledger",
  "mise run --force gen:ledger",
]

[tasks."gen:inventory"]
description = "Stage 1 (EXT-6): re-extract inventory.json from the vendored pinned Effect sources"
dir = "{{config_root}}/experiments/entity-store-extract"
sources = ["src/**/*.ts", "vendor/effect-src/**"]
outputs = ["inventory.json"]
run = "bun run src/extract.ts"

[tasks."gen:vectors"]
description = "Regenerate the golden-vector corpus and transcripts from the oracle (CV-1 bundle raw material)"
dir = "{{config_root}}/experiments/entity-store-shell"
# The two local `require`s in this package's lakefile are declared too:
# a change under the E2 model or the fips202 annex changes these
# vectors, and neither lives under this task's dir.
#
# `.harness-work` is deliberately absent from BOTH lists: it is scratch
# that the middle command `git clean`s away, and declaring scratch as an
# output would make the runner treat a wiped directory as a build
# product and rerun forever.
sources = [
  "lakefile.toml", "lean-toolchain",
  "Shell.lean", "Shell/**/*.lean",
  "VectorsMain.lean", "HarnessMain.lean",
  "harness/**",
  "../entity-store-model/E2.lean", "../entity-store-model/E2/**/*.lean",
  "../../formal/fips202/Sha3.lean", "../../formal/fips202/Sha3/**/*.lean",
]
outputs = ["vectors/**", "transcripts/**"]
run = [
  "lake exe estore-vectors vectors",
  "git clean -qxfd .harness-work",
  "lake exe harness harness .harness-work --record transcripts",
]

[tasks."gen:ledger"]
description = "Regenerate docs/entity-store/LEDGER.md by fresh extraction (PROCEDURE §8)"
dir = "{{config_root}}/experiments/entity-store-ledger"
# This ledger is extracted by SHELLING OUT to lake in two sibling
# packages, so its real inputs are those packages' Lean trees, not
# anything under its own dir. The harness leg runs in a `mkdtemp` work
# directory outside the repo, so it contributes no output.
sources = [
  "package.json", "src/*.ts",
  "../entity-store-model/E2.lean", "../entity-store-model/E2/**/*.lean",
  "../entity-store-shell/Shell.lean", "../entity-store-shell/Shell/**/*.lean",
  "../entity-store-shell/HarnessMain.lean", "../entity-store-shell/harness/**",
  "../../formal/fips202/Sha3.lean", "../../formal/fips202/Sha3/**/*.lean",
]
outputs = ["../../docs/entity-store/LEDGER.md"]
run = "bun run gen"

[tasks."check:fips202"]
description = "Build and replay the promoted fips202 Lean artifact"
dir = "{{config_root}}/formal/fips202"
run = [
  "lake --wfail build",
  "lake env leanchecker --fresh Sha3.Bridge",
]

[tasks."check:entity-store"]
description = "Build the E2 model with its opaque/unsafe gate and axiom reports"
dir = "{{config_root}}/experiments/entity-store-model"
run = "lake --wfail build"

[tasks."check:machine"]
description = "Build the machine library under --wfail"
dir = "{{config_root}}/library/machine"
run = "lake --wfail build"

# THE CAS EMITTERS' SHARED SOURCE SET.
#
# `sources` and `outputs` resolve relative to the task's `dir`, NOT to
# `config_root` — verified, and it is the opposite of what the paths in
# a root config look like they mean. So every cas task's globs are
# written from `library/cas`, which is exactly how each tool's own
# `Gate.Fixture.path` is written. `..`-escaping paths are honoured on
# both sides, which is what lets an emitter declare the file it writes
# into `library/effects` or `docs/`.
#
# Every cas emitter reads the compiled library, so every cas emitter
# declares the WHOLE Lean tree. This is deliberate over-declaration:
# nobody has to know which emitter reads which module, and nobody has to
# maintain that knowledge as the library moves. Tasks whose inputs go
# beyond the Lean tree add them; those additions are the only per-task
# judgment here, and each is named where it appears.
#
# `outputs` are transcribed from each tool's own fixture list — the
# authority is `lake exe <tool> --check --json`, whose `fixture` field
# is the path below. `library/cas/meta/out/environment.META.json` carries
# the join as data, so an emitter that forgets a declaration is a red
# gate.

[tasks."gen:cas-vectors"]
description = "Regenerate the CAS conformance vectors from the Lean registry"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = [
  "vectors/value-single.json",
  "vectors/blob-two-leaves.json",
  "vectors/file-readme.json",
  "vectors/journal-two-entries.json",
  "vectors/shared-chunk.json",
  "vectors/git-pin-commit.json",
  "vectors/schema-vector-document.json",
  "vectors/index.json",
]
run = "lake exe vectors"

[tasks."gen:cas-schemas"]
description = "Regenerate the canonical-schema payload fixtures from the Lean self-codec registry"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = [
  "schemas/vector-document.json",
  "schemas/vector-index.json",
  "schemas/pin-sample.json",
  "schemas/literal-pin.json",
  "schemas/annotation.json",
  "schemas/union-pin.json",
  "schemas/tagged-pin.json",
  "schemas/enum-pin.json",
  "schemas/tuple-pin.json",
  "schemas/exchange.json",
  "schemas/index.json",
  "schemas/addresses.json",
  "../effects/src/cas/generated/annotationPlane.ts",
  "../effects/src/cas/generated/StoreKindSchema.ts",
]
run = "lake exe schemas"

[tasks."gen:cas-verdicts"]
description = "Regenerate the two-doors conformance corpus (code/value/verdict triples) by executing the Lean model"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
