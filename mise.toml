[tools]
bun = "1.4.0"
node = "22.23.2"

[tasks.gen]
description = "Regenerate every derived file from declared sources"
run = [
  "mise run gen:vectors",
  "mise run gen:cas-vectors",
  "mise run gen:cas-schemas",
  "mise run gen:cas-verdicts",
  "mise run gen:backend-wire",
  "mise run gen:backend-programs",
  "mise run gen:backend-mcp",
  "mise run gen:backend-materialize",
  "mise run gen:lift-manifest",
  "mise run gen:cas-surface",
  "mise run gen:ledger",
]

[tasks."gen:vectors"]
description = "Regenerate the golden-vector corpus and transcripts from the oracle (CV-1 bundle raw material)"
dir = "{{config_root}}/experiments/entity-store-shell"
run = [
  "lake exe estore-vectors vectors",
  "git clean -qxfd .harness-work",
  "lake exe harness harness .harness-work --record transcripts",
]

[tasks."gen:ledger"]
description = "Regenerate docs/entity-store/LEDGER.md by fresh extraction (PROCEDURE §8)"
dir = "{{config_root}}/experiments/entity-store-ledger"
run = "bun run gen"

[tasks."check:fips202"]
description = "Build and replay the promoted fips202 Lean artifact"
dir = "{{config_root}}/formal/fips202"
run = [
  "lake --wfail build",
  "lake env leanchecker --fresh Sha3.Bridge",
]

[tasks."check:entity-store"]
description = "Build the E2 model with its opaque/unsafe gate and axiom reports"
dir = "{{config_root}}/experiments/entity-store-model"
run = "lake --wfail build"

[tasks."check:machine"]
description = "Build the machine library under --wfail"
dir = "{{config_root}}/library/machine"
run = "lake --wfail build"

[tasks."gen:cas-vectors"]
description = "Regenerate the CAS conformance vectors from the Lean registry"
dir = "{{config_root}}/library/cas"
run = "lake exe vectors"

[tasks."gen:cas-schemas"]
description = "Regenerate the canonical-schema payload fixtures from the Lean self-codec registry"
dir = "{{config_root}}/library/cas"
run = "lake exe schemas"

[tasks."gen:cas-verdicts"]
description = "Regenerate the two-doors conformance corpus (code/value/verdict triples) by executing the Lean model"
dir = "{{config_root}}/library/cas"
run = "lake exe verdicts"

[tasks."gen:backend-wire"]
description = "Regenerate the effects package's generated canonical-schema mirrors from the Lean codes"
dir = "{{config_root}}/library/cas"
run = "lake exe emitwire"

[tasks."gen:backend-programs"]
description = "Regenerate the straight-line Effect programs of the registered grammar terms"
dir = "{{config_root}}/library/cas"
run = "lake exe emitprograms"

[tasks."gen:backend-mcp"]
description = "Regenerate the versioned CAS MCP tool manifest from the signatures"
dir = "{{config_root}}/library/cas"
run = "lake exe mcpspec"

[tasks."gen:lift-manifest"]
description = "Regenerate the effect-lift rule manifest (JSON + Markdown projections) from the Lean lift data (authority: Cas.Lift.manifestV0)"
dir = "{{config_root}}/library/cas"
run = "lake exe emitlift"

[tasks."gen:backend-materialize"]
description = "Regenerate the estate-native materialized modules (P6's second register) from the committed schema payloads"
dir = "{{config_root}}/library/cas"
run = "lake exe materialize"

[tasks."gen:cas-surface"]
description = "Regenerate the Cas surface ledger (per-declaration signatures, doc coverage, axiom census) from the compiled environment"
dir = "{{config_root}}/library/cas"
run = "lake exe surface"

[tasks."check:cas"]
description = "Build the CAS type model under --wfail and run the vector, schema, conformance-verdict, wire-mirror, program, materialization, MCP-manifest, lift-manifest, and surface-ledger byte-identity gates"
dir = "{{config_root}}/library/cas"
run = [
  "lake --wfail build",
  "lake exe vectors --check",
  "lake exe schemas --check",
  "lake exe verdicts --check",
  "lake exe emitwire --check",
  "lake exe emitprograms --check",
  "lake exe materialize --check",
  "lake exe mcpspec --check",
  "lake exe emitlift --check",
  "lake exe surface --check",
]

[tasks."check:effects:archive"]
description = "Build the RETIRED effects-model@0.3.0 corpus and run its frozen gates (manual; not in CI)"
dir = "{{config_root}}/library/effects/archive/lean-model-0.3"
run = [
  "lake --wfail build",
  "lake exe conformance_ledger CONFORMANCE-LEDGER.md",
  "lake exe conformance_manifest conformance/manifest",
  "bun scripts/check-ledger-transitions.ts",
  "bun scripts/check-mutant-quarantine.ts",
  "lake exe conformance_mutation",
  "git diff --exit-code -- CONFORMANCE-LEDGER.md conformance/manifest",
]

[tasks."gen:effects:archive"]
description = "Regenerate the RETIRED corpus's ledger and manifests (must stay byte-identical at 0.3.0)"
dir = "{{config_root}}/library/effects/archive/lean-model-0.3"
run = [
  "lake exe conformance_ledger CONFORMANCE-LEDGER.md",
  "lake exe conformance_manifest conformance/manifest",
]

[tasks."brief:effects:archive"]
description = "Print the RETIRED corpus's lane briefing"
dir = "{{config_root}}/library/effects/archive/lean-model-0.3"
run = "lake exe conformance_brief"

[tasks."gen:effects:research"]
description = "Refresh the effects research/docs snapshots from their canonical owners"
dir = "{{config_root}}/library/effects"
run = "bun scripts/sync-research.ts --write"

[tasks."check:effects:research"]
description = "Assert the effects research/docs snapshots are byte-equal to their canonical owners"
dir = "{{config_root}}/library/effects"
run = "bun scripts/sync-research.ts"

[tasks."check:effects:ts"]
description = "Frozen install, typecheck, test, build, and consumer-smoke the effects TypeScript package"
dir = "{{config_root}}/library/effects"
run = [
  "bun scripts/check-src-purity.ts",
  "bun install --frozen-lockfile",
  "bun run lint",
  "bun run typecheck",
  "bun run test",
  "bun run build",
  "bun scripts/check-dist-consumer.ts",
]

[tasks."check:ledger"]
description = "Both packages green, harness green, committed LEDGER.md byte-equal to a fresh extraction"
dir = "{{config_root}}/experiments/entity-store-ledger"
run = [
  "bun test",
  "bun run check",
]

[tasks.check]
description = "gen + clean-tree assertion + tests and gates (what CI runs)"
run = [
  "mise run gen",
  "git diff --exit-code",
  "mise run check:fips202",
  "mise run check:entity-store",
  "mise run check:machine",
  "mise run check:cas",
  "mise run check:effects:ts",
  "mise run check:effects:research",
  "mise run check:ledger",
]

[tasks."check:extract-twin"]
description = "Stage 1 cross-instrument gate: TS-compiler-API extractor vs lean4-tree-sitter twin (bootstraps the pinned C seam; network + elan on first run; not in the default check chain)"
dir = "{{config_root}}/experiments/entity-store-extract/twin"
run = [
  "bash bootstrap.sh",
  "bash -c 'cd extract-lean && lake build'",
  "bash -c 'cd harness && bun install --frozen-lockfile && bun run check'",
]
