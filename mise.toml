run = "lake exe admissionmap"

[tasks."gen:backend-wire"]
description = "Regenerate the effects package's generated canonical-schema mirrors from the Lean codes"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = ["../effects/src/cas/generated/ConformanceVectorSchema.ts"]
run = "lake exe emitwire"

[tasks."gen:backend-word"]
description = "Regenerate the word-record mirrors (the receipt and the history document) from the Lean codes — the effects package's copy and the workbench's, printed from one registry in one run"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
