# WHAT CI MUST RUN. `check` is the local chain and is allowed to skip a
# fresh task; `check:ci` is the authoritative one and skips nothing.
#
# This is not belt-and-braces, it is load-bearing, and the reason is a
# measured refutation rather than a precaution. The study reasoned — from
# mise's source, explicitly without testing it — that a fresh clone
# re-runs everything on its own, because git stamps every file with
# checkout time and mise's default freshness is the STRICT
# `max(source mtime) < max(output mtime)`. That reasoning is FALSE, and
# the failure is systematic rather than a race:
#
#   git checks a clone out in index order, so a file's mtime is ordered
#   by its PATH. Wherever an output path sorts after its source paths —
#   `Cas/**` and `tools/**` sources against `docs/`, `schemas/`,
#   `surface/`, `vectors/` outputs, which is nearly every task here —
#   the outputs are stamped LATER and the task is fresh on arrival.
#
# Verified: a fixture with sources under `aaa/` and outputs under `zzz/`,
# cloned to a new path with an empty MISE_STATE_DIR, reported "sources
# up-to-date, skipping" and never ran. A fresh CI clone would have
# gated nothing and reported green.
#
# Two things fix it, and both are in force:
#
#   1. `task.source_freshness_hash_contents` (see [settings]). Freshness
#      becomes a blake3 over source CONTENTS recorded in the state dir,
#      and a fresh runner has no such record — so the same clone that
#      skipped under mtime RAN under content hashing. Verified. This is
#      why that setting is mandatory and not a nicety.
#   2. This task. `mise run --force` does NOT propagate into the
#      `mise run X` lines inside a `run` list (verified: the outer force
#      is ignored and the inner task skips), and there is no force
#      setting or environment variable. The only mechanism that works is
#      spelling `--force` on each nested invocation, which is what this
#      task is. CI runs `mise run check:ci`, never `mise run check`.
[tasks."check:ci"]
description = "What CI runs: `check`, with every task FORCED. Skipping is a local convenience and must never decide a gate — see the comment above for the measured reason a fresh clone does not force on its own"
run = [
  "mise run gen:ci",
  "git diff --exit-code",
  "mise run --force check:fips202",
  "mise run --force check:entity-store",
  "mise run --force check:extract",
  "mise run --force check:generate",
  "mise run --force check:machine",
  # The two split ledgers are forced BEFORE `check:cas`, which invokes
  # them itself: forced first, they are then fresh when it reaches them,
  # so each runs exactly once instead of once skipped and once forced.
  "mise run --force check:cas:surface",
  "mise run --force check:cas:obligations",
  "mise run --force check:cas",
  "mise run --force check:effects:ts",
  "mise run --force check:effects:research",
  "mise run --force check:ledger",
]

[tasks.check]
description = "gen + clean-tree assertion + tests and gates (the LOCAL chain — it may skip a task whose sources are unchanged; CI runs check:ci, which forces)"
run = [
  "mise run gen",
  "git diff --exit-code",
  "mise run check:fips202",
  "mise run check:entity-store",
  "mise run check:extract",
  "mise run check:generate",
  "mise run check:machine",
  "mise run check:cas",
  "mise run check:effects:ts",
  "mise run check:effects:research",
  "mise run check:ledger",
  "mise run check:workbench",
]

