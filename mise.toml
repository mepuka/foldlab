[tasks."gen:backend-programs"]
description = "Regenerate the straight-line Effect programs of the registered grammar terms, the lift documents the recognizer must answer for them (P3's Lean half), and the step/cont addresses each program has as store content (R7's stamp clause — the cross-host codec gate)"
dir = "{{config_root}}/library/cas"
