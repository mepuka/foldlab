run = "lake exe emitword"

[tasks."gen:backend-gate"]
description = "Regenerate the effects package's admission table (what the schema door admits, as data) from the Lean manifest"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
