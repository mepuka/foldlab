[tasks."gen:backend-materialize"]
description = "Regenerate the estate-native materialized modules (P6's second register) from the committed schema payloads"
dir = "{{config_root}}/library/cas"
# Beyond the Lean tree: this emitter reads the COMMITTED schema payloads
# back through the ingestion door (`schemas/index.json`,
# `schemas/addresses.json`, and each payload), so it is downstream of
# `gen:cas-schemas` through the filesystem rather than through a task
# dependency. Declaring them is what makes that edge real to the runner.
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "schemas/*.json",
]
outputs = [
  "../effects/test/generated/materialized/estate/vector-document.ts",
  "../effects/test/generated/materialized/estate/vector-index.ts",
  "../effects/test/generated/materialized/estate/pin-sample.ts",
  "../effects/test/generated/materialized/estate/literal-pin.ts",
  "../effects/test/generated/materialized/estate/annotation.ts",
  "../effects/test/generated/materialized/estate/union-pin.ts",
  "../effects/test/generated/materialized/estate/tagged-pin.ts",
  "../effects/test/generated/materialized/estate/enum-pin.ts",
  "../effects/test/generated/materialized/estate/tuple-pin.ts",
  "../effects/test/generated/materialized/estate/exchange.ts",
  "../effects/test/generated/materialized/estate/index.ts",
]
run = "lake exe materialize"

[tasks."gen:effects-materialize"]
description = "Regenerate the Effect-native materialized modules (Materialize.source's committed snapshots)"
dir = "{{config_root}}/library/effects"
# The Effect-native register of the P6 differential. It reads the SAME
# committed schema payloads `lake exe materialize` reads, so it too is
# downstream of `gen:cas-schemas` through the filesystem. Its outputs
# land under `materialized/effect/`; the sibling `materialized/estate/`
# is the Lean register and belongs to `gen:backend-materialize`.
sources = [
  "scripts/gen-materialized.ts",
  "src/**/*.ts",
  "test/fixtures/materialized.ts", "test/fixtures/read.ts",
  "../cas/schemas/**/*.json",
]
outputs = ["test/generated/materialized/effect/**"]
run = "bun scripts/gen-materialized.ts"

[tasks."gen:cas-surface"]
description = "Regenerate the Cas surface ledger (per-declaration signatures, doc coverage, axiom census) from the compiled environment"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = ["meta/out/surface.META.json"]
run = "lake exe surface"

[tasks."gen:cas-obligations"]
description = "Regenerate the Cas obligation ledger (the named obligations written in the docstrings, plus the health counters) from the compiled environment"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = ["meta/out/obligations.META.json"]
run = "lake exe obligations"

# THE ONE EMITTER THAT USED TO RUN EVERY TIME. Until this declaration
# landed, `gen:cas-laws` carried no `sources`, so the ledger filed it
# under `undeclared` and `laws` under `unjoined`, and the runner had no
# choice but to re-run `lake exe laws` on EVERY `mise run gen` — and so
# on every `mise run check`. The bytes were never wrong; they were
# byte-identical each time. The estate simply does not pay for a Lean
# emitter run it can prove is unnecessary.
#
# The inputs ARE nameable, which is what made the hole an oversight
# rather than the honest answer BS1 allows. The law index reads the
# COMPILED ENVIRONMENT and nothing else: the ruling registry is a Lean
# value (`tools/Law.lean` transcribes SCHEMA-MATERIALIZATION.md's queue
# by hand) and the `LAW <id>` claims it joins are docstrings in the
# tree. So the sibling emitters' source set is exactly right.
#
# `SCHEMA-MATERIALIZATION.md` is carried anyway — deliberate
# over-declaration, and the same file `check:cas:laws` already lists.
# The emitter does not read it, but it is the thing `Law.registry`
# transcribes, and a ruling edited in the prose queue should re-run the
# join rather than wait for an unrelated Lean edit to shake it loose.
[tasks."gen:cas-laws"]
description = "Regenerate the law index (the ruling registry joined to the LAW lines the enforcing declarations carry) from the compiled environment"
dir = "{{config_root}}/library/cas"
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "SCHEMA-MATERIALIZATION.md",
]
outputs = ["meta/out/laws.META.json"]
run = "lake exe laws"

[tasks."gen:debts"]
description = "Regenerate the debt projection (the docstring obligations still owed, parked or pin-pending, joined to the law index's unbound rulings) from the compiled environment"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = ["meta/out/debts.META.json"]
run = "lake exe debts"

# The emitter REFUSES — nonzero exit, naming the declaration — when a
# declaration depends on an axiom outside `Walk.cleanAxioms`. That is
# why the axiom gate is a `gen:` task and not only a `check:` one: the
# refusal fires in `gen:ci` before `git diff --exit-code` is ever
# reached, so a `sorryAx` cannot be regenerated into the tree quietly.
[tasks."gen:axioms"]
description = "Regenerate the axiom report (every declaration's axiom dependencies over the surface ledger's import closure) and refuse any dependency outside the clean set"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = ["meta/out/axioms.META.json"]
run = "lake exe axioms"

[tasks."gen:meta"]
description = "Regenerate the meta plane: the closed schema AST the front end interprets, one JSON Schema per described artifact, and the plane's own MANIFEST.META.json registry, all printed from the Lean shape declarations"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
outputs = [
  "../effects/src/cas/generated/meta/names.META.schema.json",
  "../effects/src/cas/generated/meta/cas-debts.META.schema.json",
  "../effects/src/cas/generated/meta/cas-axioms.META.schema.json",
  "../effects/src/cas/generated/meta/cas-trust.META.schema.json",
  "../effects/src/cas/generated/meta/cas-strata.META.schema.json",
  "../effects/src/cas/generated/meta/manifest.META.schema.json",
  "../effects/src/cas/generated/meta/metaSchemaAst.META.ts",
  "meta/MANIFEST.META.json",
]
run = "lake exe emitmeta"

[tasks."gen:trust"]
description = "Regenerate the trust census (every TypeScript file the effects package ships, in the stratum that holds it: emitted, model-gated, tested, or bare)"
dir = "{{config_root}}/library/cas"
# Beyond the Lean tree: the census's whole subject is the SIBLING
# package's TypeScript. `src` and `bin` are what it classifies; `test`
# is what decides the `tested` stratum, so a test that stops importing
# a module must re-run the census. It runs after `gen:meta` in the
# chain because that emitter can add a `.ts` module to the generated
# tree the census counts.
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "meta/in/model-gated.META.json",
  "../effects/src/**/*.ts",
  "../effects/bin/**/*.ts",
  "../effects/test/**/*.ts",
]
outputs = ["meta/out/trust.META.json"]
run = "lake exe trust"

[tasks."gen:strata"]
description = "Regenerate the strata gate's document (the declared stratum order, each library's membership as its lakefile globs decide it, the computed per-module import edges, and the verdicts) and refuse an out-of-stratum import"
dir = "{{config_root}}/library/cas"
# Beyond the Lean tree: `lakefile.toml` is this gate's MEMBERSHIP
# AUTHORITY, not just its build description — a glob moved there moves
# which stratum a module is in — and it is already in the shared source
# set below, so nothing extra is needed. The tool imports the compiled
# library to read its per-module import edges, which is why the whole
# Lean tree is declared as it is for every other cas emitter.
#
# The emitter REFUSES — nonzero exit, naming the module and the edge —
# on an out-of-stratum import that no KNOWN MISFILES row declares, and
# on a declared row nothing matches. That is why the strata gate is a
# `gen:` task and not only a `check:` one: the refusal fires in `gen:ci`
# before `git diff --exit-code` is ever reached, so a violating import
# cannot be regenerated into the tree quietly. `gen:axioms` is the
# precedent.
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
