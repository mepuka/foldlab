run = "lake exe emitgate"

[tasks."gen:backend-architecture"]
description = "Regenerate the effects package's self-description (the data vocabulary, the seams, the laws, the backends, and the capability-matrix pin) from the Lean architecture value"
dir = "{{config_root}}/library/cas"
sources = ["Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain"]
