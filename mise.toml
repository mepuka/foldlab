run = "lake exe verdicts"

[tasks."gen:cas-admission-map"]
description = "Regenerate the ACC-1 carrier-adequacy table (every Representation variant's admission verdict) from Cas.Schema.admissionMapV0"
dir = "{{config_root}}/library/cas"
# Beyond the Lean tree: the extraction inventory is a genuine second
# input — `AdmissionMap` checks every variant of the committed
# inventory has exactly one row, so a new variant there must re-run it.
sources = [
  "Cas/**/*.lean", "tools/**/*.lean", "examples/**/*.lean", "lakefile.toml", "lean-toolchain",
  "../../experiments/entity-store-extract/inventory.json",
]
