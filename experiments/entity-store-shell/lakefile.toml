name = "entity-store-shell"
defaultTargets = [
  "Shell", "Roots", "RootGate",
  "estore", "estore-encode", "harness", "estore-vectors",
]

[[require]]
name = "entity-store"
path = "../entity-store-model"

[[require]]
name = "fips202"
path = "../../formal/fips202"

[[lean_lib]]
name = "Shell"

# The executable roots, ALSO declared as a library so the whole-package gate can import
# them. Without this they are invisible to every G-S scan (F-43(a)).
[[lean_lib]]
name = "Roots"
roots = ["Main", "EncodeMain", "HarnessMain", "VectorsMain"]

# The whole-package gate: scans the executable roots too (F-43(a)).
[[lean_lib]]
name = "RootGate"
roots = ["RootGate.Cli", "RootGate.Encode", "RootGate.Harness", "RootGate.Vectors"]

[[lean_exe]]
name = "estore"
root = "Main"

[[lean_exe]]
name = "harness"
root = "HarnessMain"

[[lean_exe]]
name = "estore-encode"
root = "EncodeMain"

[[lean_exe]]
name = "estore-vectors"
root = "VectorsMain"
