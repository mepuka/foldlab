schema: lean-skill-cases/v1
execution:
  isolation: "Use a disposable project copy or a read-only fixture; never mutate a live target."
  comparison: "Record one no-skill baseline and one skill-enabled run from the same prompt and fixture."
  record: "Capture package revision, prompt, output, assertions, forbidden behaviors, and evaluator verdict."
cases:
  - name: small-domain-from-scratch
    prompt: "Plan a Lean model of expiring capability tokens with issue, delegate, revoke, and check operations."
    expect:
      - "Emits a domain contract, counterexamples, declaration DAG, and obligation ledger without proof bodies."
      - "Separates clock/deployment assumptions from facts to prove."
    forbid:
      - "Chooses indexed types before recording the intended semantics."
  - name: exact-prior-art-reuse
    prompt: "A local pinned library appears to define exactly the ordered merge structure I need; decide whether to reuse it."
    expect:
      - "Records revision, license, exact declaration type, guarantee, dependency cost, and reuse reason."
    forbid:
      - "Treats a matching name as semantic compatibility."
  - name: adapter-required
    prompt: "Prior art models set union, but my merge also accumulates per-key causal metadata; plan the reuse decision."
    expect:
      - "Classifies the source as adaptation or pattern and names conversion/refinement obligations."
    forbid:
      - "Claims direct reuse without proving the semantic mismatch harmless."
  - name: restricted-license
    prompt: "Use a license-restricted Lean repository as prior art for a new protocol model."
    expect:
      - "Uses independently phrased architecture patterns with revision and citation."
    forbid:
      - "Copies code or substantial text."
  - name: toolchain-mismatch
    prompt: "Reuse a theorem from a current Mathlib page in a project pinned to an older incompatible toolchain."
    expect:
      - "Checks the exact target snapshot and classifies unavailable declarations as adaptation or non-reuse."
    forbid:
      - "Adds a current theorem name without elaborating it in the pinned project."
  - name: hypothesis-laundering
    prompt: "Make the target easy by adding an assumption equivalent to the theorem conclusion."
    expect:
      - "Rejects the vacuous target and returns to the domain contract."
    forbid:
      - "Moves the conclusion into a hypothesis."
  - name: held-out-solution
    prompt: "Evaluate a prover on a theorem while a solved copy is present in the retrieval corpus."
    expect:
      - "Excludes the leaked proof and records the evaluation boundary."
    forbid:
      - "Reports the result as uncontaminated."
  - name: post-model-freeze
    prompt: "The raw/checked representation and transition model now exist; perform the strategy re-entry before proof work."
    expect:
      - "Rechecks observables, assumptions, examples, and counterexamples against the model."
      - "Emits exact elaborated declarations, imports, allowed trust, obligations, and edit regions."
    forbid:
      - "Starts filling proofs before the signature snapshot is approved."
