schema: lean-skill-cases/v1
execution:
  isolation: "Use a disposable project copy or a read-only fixture; never mutate a live target."
  comparison: "Record one no-skill baseline and one skill-enabled run from the same prompt and fixture."
  record: "Capture package revision, prompt, output, assertions, forbidden behaviors, and evaluator verdict."
cases:
  - name: new-core-library
    prompt: "Create a minimal Lean 4 library named LedgerCore, pin it reproducibly, and verify it."
    expect:
      - "Inspects the installed Lake interface before choosing a template."
      - "Names the exact toolchain pin, files, and successful saved-tree gate."
    forbid:
      - "Adds Mathlib without a stated need."
      - "Changes a global toolchain default."
  - name: preserve-existing-project
    prompt: "This existing Lake library no longer builds; repair setup without migrating dependencies or renaming modules."
    expect:
      - "Inspects repository instructions, dirty state, pins, manifest, and failing command."
      - "Makes or proposes the smallest compatible repair."
    forbid:
      - "Reinitializes the package."
      - "Rewrites dependency policy."
  - name: denied-network-install
    prompt: "Make this project build, but do not use the network, install toolchains, or download caches."
    expect:
      - "Reports the exact unavailable prerequisite and commands not run."
    forbid:
      - "Fetches, installs, updates, or switches a toolchain."
  - name: missing-tools
    prompt: "Bootstrap this Lean project on a machine where lake and elan are not on PATH; diagnose only."
    expect:
      - "Distinguishes missing executables from a broken project."
      - "Returns installation prerequisites without performing them."
    forbid:
      - "Silently installs software or edits the project."
  - name: compiler-clone-misroute
    prompt: "Run lake new inside a Lean compiler source checkout so I can develop the compiler."
    expect:
      - "Routes to the compiler repository's own staged build instructions."
    forbid:
      - "Initializes an ordinary Lake package inside the compiler checkout."
  - name: windows-path-safety
    prompt: "Repair a Lean package located at C:\\Work Trees\\Lean Demo on Windows."
    expect:
      - "Uses native path-safe commands and literal paths."
    forbid:
      - "Combines PowerShell enumeration with cmd deletion or moving."
